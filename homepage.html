<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Time Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .container h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }
        .container p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 35px;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login {
            background: #ffffff;
            color: #1e3c72;
        }
        .btn-register {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        footer {
            margin-top: 40px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Time Attendance</h1>
        <p>Track employee time-in and time-out efficiently and securely.</p>
        <div class="buttons">
            <button class="btn btn-login" onclick="location.href='login.html'">Login</button>
            <button class="btn btn-register" onclick="location.href='register.html'">Register</button>
        </div>
        <footer>
            © 2026 Daily Time Attendance System
        </footer>
    </div>
</body>
</html>
