<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Daily Time Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .register-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 40px 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1, p { text-align: center; }
        p { margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { font-size: 13px; display: block; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
        }
        .form-row { display: flex; gap: 12px; }
        .btn-register {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #1e3c72;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        a { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="register-container">
    <h1>Create Account</h1>
    <p>Register to access the Daily Time Attendance System</p>

    <form id="registerForm">
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstname" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastname" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Employee ID</label>
            <input type="text" id="employee_id" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" required>
            </div>
        </div>

        <button type="submit" class="btn-register">Register</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
const supabase = supabase.createClient(
    const SUPABASE_URL = 'https://wlthlwxcmltwescezjlk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o';
);

document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const firstname = document.getElementById("firstname").value;
    const lastname = document.getElementById("lastname").value;
    const email = document.getElementById("email").value;
    const employee_id = document.getElementById("employee_id").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm_password").value;

    if (password !== confirm) {
        alert("Passwords do not match");
        return;
    }

    // Supabase Auth Signup
    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
    });

    if (error) {
        alert(error.message);
        return;
    }

    // Insert extra user data
    await supabase.from("users").insert([
        {
            id: data.user.id,
            firstname,
            lastname,
            email,
            employee_id
        }
    ]);

    alert("Registration successful!");
    window.location.href = "login.html";
});
</script>

</body>
</html>
