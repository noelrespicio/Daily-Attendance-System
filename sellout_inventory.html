<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellout Inventory</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  padding:15px;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.header h2{
  color:#1e3a8a;
}

.back-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.card h3{
  margin-bottom:15px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:5px;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}

button.save-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#059669;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button.save-btn:hover{
  background:#047857;
}

table{
  width:100%;
  border-collapse:collapse;
  overflow:auto;
}

th,td{
  border-bottom:1px solid #eee;
  padding:10px;
  text-align:left;
  font-size:14px;
}

th{
  background:#f3f4f6;
}

.delete-btn{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h2>📦 Sellout Inventory</h2>
    <button class="back-btn" onclick="location.href='attendance.html'">← Back</button>
  </div>

  <!-- FORM -->
  <div class="card">
    <h3>Add Sellout Item</h3>

    <div class="form-group">
      <label>Model</label>
      <input type="text" id="model" placeholder="Enter model">
    </div>

    <div class="form-group">
      <label>SN IN</label>
      <input type="text" id="sn_in" placeholder="Enter SN IN">
    </div>

    <div class="form-group">
      <label>SN OUT</label>
      <input type="text" id="sn_out" placeholder="Enter SN OUT">
    </div>

    <div class="form-group">
      <label>Invoice No.</label>
      <input type="text" id="invoice_no" placeholder="Enter invoice number">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input type="number" id="qty" placeholder="Enter quantity">
    </div>

    <button class="save-btn" onclick="saveSellout()">
      💾 Save Sellout
    </button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>📋 Sellout Records</h3>

    <table>
      <thead>
        <tr>
          <th>Model</th>
          <th>SN IN</th>
          <th>SN OUT</th>
          <th>Invoice No.</th>
          <th>Qty</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="selloutTable">
        <tr>
          <td colspan="6">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user;

/* AUTH */
(async()=>{
  const { data } = await supabaseClient.auth.getSession();

  if(!data.session){
    location.href = "login.html";
    return;
  }

  user = data.session.user;

  loadSellouts();
})();

/* SAVE */
async function saveSellout(){

  const model = document.getElementById("model").value.trim();
  const sn_in = document.getElementById("sn_in").value.trim();
  const sn_out = document.getElementById("sn_out").value.trim();
  const invoice_no = document.getElementById("invoice_no").value.trim();
  const qty = parseInt(document.getElementById("qty").value);

  if(!model || !sn_in || !sn_out || !invoice_no || !qty){
    alert("Please complete all fields");
    return;
  }

  const { error } = await supabaseClient
    .from("sellout_inventory")
    .insert({
      user_id:user.id,
      model,
      sn_in,
      sn_out,
      invoice_no,
      qty
    });

  if(error){
    alert("Failed to save");
    console.error(error);
    return;
  }

  alert("Sellout saved successfully ✅");

  document.getElementById("model").value = "";
  document.getElementById("sn_in").value = "";
  document.getElementById("sn_out").value = "";
  document.getElementById("invoice_no").value = "";
  document.getElementById("qty").value = "";

  loadSellouts();
}

/* LOAD */
async function loadSellouts(){

  const tbody = document.getElementById("selloutTable");

  tbody.innerHTML = `
    <tr>
      <td colspan="6">Loading...</td>
    </tr>
  `;

  const { data, error } = await supabaseClient
    .from("sellout_inventory")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at",{ascending:false});

  if(error){
    tbody.innerHTML = `
      <tr>
        <td colspan="6">Failed to load</td>
      </tr>
    `;
    return;
  }

  if(!data.length){
    tbody.innerHTML = `
      <tr>
        <td colspan="6">No records found</td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = "";

  data.forEach(item=>{

    tbody.innerHTML += `
      <tr>
        <td>${item.model}</td>
        <td>${item.sn_in}</td>
        <td>${item.sn_out}</td>
        <td>${item.invoice_no}</td>
        <td>${item.qty}</td>
        <td>
          <button class="delete-btn"
            onclick="deleteSellout('${item.id}')">
            Delete
          </button>
        </td>
      </tr>
    `;
  });
}

/* DELETE */
async function deleteSellout(id){

  if(!confirm("Delete this record?")) return;

  const { error } = await supabaseClient
    .from("sellout_inventory")
    .delete()
    .eq("id",id);

  if(error){
    alert("Delete failed");
    return;
  }

  loadSellouts();
}
</script>

</body>
</html>
