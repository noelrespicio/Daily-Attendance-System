<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellout Inventory</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#f1f5f9;
  padding:15px;
}

.container{
  max-width:700px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h2{
  color:#1e3a8a;
}

.back-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
  margin-bottom:20px;
  color:#111827;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:600;
  color:#374151;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#2563eb;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.save-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#059669;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.save-btn:hover{
  background:#047857;
}

.records-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#1e3a8a;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.records-btn:hover{
  background:#172554;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h2>📦 Sellout Inventory</h2>

    <button class="back-btn"
      onclick="location.href='dasboard.html'">
      ← Back
    </button>
  </div>

  <div class="card">

    <h3>Add Sellout Item</h3>

    <!-- DATE -->
    <div class="form-group">
      <label>Sellout Date</label>
      <input type="date" id="sellout_date">
    </div>

    <!-- MODEL -->
    <div class="form-group">
      <label>Model</label>
      <input type="text"
        id="model"
        placeholder="Enter model">
    </div>

    <!-- SERIALS -->
    <div class="row">

      <div class="form-group">
        <label>SN IN</label>
        <input type="text"
          id="sn_in"
          placeholder="Enter SN IN">
      </div>

      <div class="form-group">
        <label>SN OUT</label>
        <input type="text"
          id="sn_out"
          placeholder="Enter SN OUT">
      </div>

    </div>

    <!-- INVOICE + QTY -->
    <div class="row">

      <div class="form-group">
        <label>Invoice No.</label>
        <input type="text"
          id="invoice_no"
          placeholder="Invoice number">
      </div>

      <div class="form-group">
        <label>Quantity</label>
        <input type="number"
          id="qty"
          placeholder="0">
      </div>

    </div>

    <!-- SAVE -->
    <button class="save-btn"
      onclick="saveSellout()">

      💾 Save Sellout

    </button>

    <!-- RECORDS -->
    <button class="records-btn"
      onclick="location.href='sellout_records.html'">

      📋 View Sellout Records

    </button>

  </div>

</div>

<script>
const SUPABASE_URL =
"https://wlthlwxcmltwescezjlk.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user;

/* AUTH */
(async()=>{

  const { data } =
    await supabaseClient.auth.getSession();

  if(!data.session){
    location.href = "login.html";
    return;
  }

  user = data.session.user;

  // AUTO TODAY DATE
  document.getElementById("sellout_date").value =
    new Date().toISOString().split('T')[0];

})();

/* SAVE */
async function saveSellout(){

  const sellout_date =
    document.getElementById("sellout_date").value;

  const model =
    document.getElementById("model").value.trim();

  const sn_in =
    document.getElementById("sn_in").value.trim();

  const sn_out =
    document.getElementById("sn_out").value.trim();

  const invoice_no =
    document.getElementById("invoice_no").value.trim();

  const qty =
    parseInt(document.getElementById("qty").value);

  if(
    !sellout_date ||
    !model ||
    !sn_in ||
    !sn_out ||
    !invoice_no ||
    !qty
  ){
    alert("Please complete all fields");
    return;
  }

  const { error } =
    await supabaseClient
    .from("sellout_inventory")
    .insert({
      user_id:user.id,
      sellout_date,
      model,
      sn_in,
      sn_out,
      invoice_no,
      qty
    });

  if(error){
    console.error(error);
    alert("Failed to save");
    return;
  }

  alert("Sellout saved successfully ✅");

  // RESET
  document.getElementById("model").value = "";
  document.getElementById("sn_in").value = "";
  document.getElementById("sn_out").value = "";
  document.getElementById("invoice_no").value = "";
  document.getElementById("qty").value = "";

  // AUTO DATE AGAIN
  document.getElementById("sellout_date").value =
    new Date().toISOString().split('T')[0];

}
</script>

</body>
</html>
