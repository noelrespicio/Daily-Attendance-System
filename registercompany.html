<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Auth | Daily Time Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma;}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:#fff;
}
.container{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  padding:35px;
  border-radius:20px;
  width:100%;
  max-width:480px;
}
h1{text-align:center;margin-bottom:10px;}
p{text-align:center;font-size:14px;margin-bottom:20px;}
.form-group{margin-bottom:15px;}
label{font-size:13px;display:block;margin-bottom:6px;}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
}
button{
  width:100%;
  padding:14px;
  border-radius:30px;
  border:none;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}
.toggle{
  text-align:center;
  margin-top:15px;
  font-size:13px;
}
.toggle a{color:#fff;font-weight:bold;cursor:pointer;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

  <!-- REGISTER -->
  <div id="registerBox">
    <h1>Register Company</h1>
    <p>Create company admin account</p>

    <form id="registerForm">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="company_name" required>
      </div>

      <div class="form-group">
        <label>Company Address</label>
        <input type="text" id="company_address" required>
      </div>

      <div class="form-group">
        <label>Contact Person</label>
        <input type="text" id="contact_person" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg_email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg_password" required minlength="6">
      </div>

      <button type="submit">Register</button>
    </form>

    <div class="toggle">
      Already have an account? <a onclick="toggleForm()">Login</a>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="hidden">
    <h1>Company Login</h1>
    <p>Access your dashboard</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login_email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login_password" required>
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="toggle">
      No account yet? <a onclick="toggleForm()">Register</a>
    </div>
  </div>

</div>

<script>
const supabaseClient = supabase.createClient(
  "https://wlthlwxcmltwescezjlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o"
);

/* TOGGLE */
function toggleForm(){
  document.getElementById("registerBox").classList.toggle("hidden");
  document.getElementById("loginBox").classList.toggle("hidden");
}

/* REGISTER */
document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();

  const email = document.getElementById("reg_email").value;
  const password = document.getElementById("reg_password").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  const userId = data.user?.id;
  if(!userId){
    alert("Check your email to confirm your account.");
    return;
  }

  const { error: insertError } = await supabaseClient
    .from("companies")
    .insert({
      user_id: userId,
      company_name: company_name.value,
      company_address: company_address.value,
      contact_person: contact_person.value,
      contact_email: email,
      status: "active"
    });

  if(insertError){
    alert(insertError.message);
    return;
  }

  alert("Company registered successfully! You can now login.");
  toggleForm();
});

/* LOGIN */
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: login_email.value,
    password: login_password.value
  });

  if(error){
    alert(error.message);
    return;
  }

  window.location.href = "companydashboard.html";
});
</script>

</body>
</html>
