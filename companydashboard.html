<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Company Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
}
h2{
  margin-bottom:10px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
  margin-bottom:20px;
}
input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:8px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
}
button:disabled{
  background:#9ca3af;
}
.status{
  font-size:13px;
  padding:4px 8px;
  border-radius:12px;
}
.invited{background:#fde68a;}
.active{background:#bbf7d0;}
</style>
</head>
<body>

<div class="container">

  <h2>🏢 Company Dashboard</h2>

  <!-- SEARCH USERS -->
  <div class="card">
    <h3>🔍 Search Users (Invite Employees)</h3>
    <input type="text" id="searchEmail" placeholder="Search by email...">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userResults">
        <tr><td colspan="3">Type email to search</td></tr>
      </tbody>
    </table>
  </div>

  <!-- EMPLOYEES LIST -->
  <div class="card">
    <h3>👨‍💼 Employees</h3>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="employeeList">
        <tr><td colspan="2">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const supabase = supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
);

let companyId;

// LOAD COMPANY
async function loadCompany(){
  const { data: { user } } = await supabase.auth.getUser();

  const { data } = await supabase
    .from("companies")
    .select("id")
    .eq("user_id", user.id)
    .single();

  companyId = data.id;
  loadEmployees();
}

loadCompany();


// SEARCH USERS
document.getElementById("searchEmail").addEventListener("input", async (e)=>{
  const keyword = e.target.value.trim();
  const tbody = document.getElementById("userResults");

  if(keyword.length < 2){
    tbody.innerHTML = `<tr><td colspan="3">Type more letters...</td></tr>`;
    return;
  }

  const { data } = await supabase
    .from("users")
    .select("id,email,full_name")
    .ilike("email", `%${keyword}%`)
    .limit(10);

  if(!data.length){
    tbody.innerHTML = `<tr><td colspan="3">No users found</td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  data.forEach(u=>{
    tbody.innerHTML += `
      <tr>
        <td>${u.email}</td>
        <td>${u.full_name ?? "-"}</td>
        <td>
          <button onclick="inviteEmployee('${u.id}')">Invite</button>
        </td>
      </tr>
    `;
  });
});


// INVITE EMPLOYEE
async function inviteEmployee(userId){
  const { error } = await supabase
    .from("employees")
    .insert({
      company_id: companyId,
      user_id: userId,
      status: "invited"
    });

  if(error){
    alert("Already invited or error");
  }else{
    alert("Invitation sent ✅");
    loadEmployees();
  }
}


// LOAD EMPLOYEES
async function loadEmployees(){
  const tbody = document.getElementById("employeeList");
  tbody.innerHTML = `<tr><td colspan="2">Loading...</td></tr>`;

  const { data } = await supabase
    .from("employees")
    .select(`
      status,
      users ( email )
    `)
    .eq("company_id", companyId);

  if(!data.length){
    tbody.innerHTML = `<tr><td colspan="2">No employees yet</td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  data.forEach(e=>{
    tbody.innerHTML += `
      <tr>
        <td>${e.users.email}</td>
        <td>
          <span class="status ${e.status}">
            ${e.status.toUpperCase()}
          </span>
        </td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
