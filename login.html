
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Daily Time Attendance</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

body {

    color: #172033;
}

.login-container {

}

@media (max-width: 480px) {
    body {
        padding: 16px;

    .login-container {
        width: 100%;

}

        .logo {
            width: 66px;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 20px;
            color: white;
            font-size: 30px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            color: #14213d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #8492a6;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 43px;
            border: 1px solid #dce3ed;
            border-radius: 12px;

            font-size: 14px;
            color: #172033;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            background: #fff;

        }

        .error-message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 10px;

            border: 1px solid #fecdd3;
            color: #be123c;
            font-size: 13px;
            line-height: 1.5;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #047857;
            font-size: 13px;
        }

        .success-message.show {
            display: block;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
            transition: 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 24px rgba(37, 99, 235, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            margin-top: 24px;
            text-align: center;
            color: #718096;
            font-size: 13px;
        }

        .register-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 11px;
        }

        @media (max-width: 420px) {
            .login-container {
                padding: 30px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="logo">⏱</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">
            Daily Time Attendance System<br>
            Sign in to access your account.
        </p>

        <div id="errorMessage" class="error-message"
             role="alert" aria-live="polite"></div>

        <div id="successMessage" class="success-message"
             role="status" aria-live="polite"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <span>✉</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span>🔒</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginButton">
                Login to Account
            </button>
        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create one</a>
        </div>

        <div class="footer">
            Daily Time Attendance System
        </div>
    </main>

    <script>
        const SUPABASE_URL =
            "https://oaorsmayfosxrfahkxgi.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Vx0EZwKgcNMQNLpmb6RtKw_wpwZ15Bz";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
            successMessage.classList.remove("show");
        }

        function hideMessages() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("show");
            successMessage.textContent = "";
            successMessage.classList.remove("show");
        }

        loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById("email")
                .value.trim();
            const password = document.getElementById("password")
                .value;

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    const message = (error.message || "").toLowerCase();

                    if (
                        message.includes("invalid login credentials") ||
                        message.includes("invalid_credentials")
                    ) {
                        showError(
                            "Incorrect email or password. Please check your details and try again."
                        );
                    } else if (
                        message.includes("email not confirmed")
                    ) {
                        showError(
                            "Your email has not been verified yet. Please check your account settings or contact your administrator."
                        );
                    } else if (
                        message.includes("too many requests") ||
                        message.includes("rate limit")
                    ) {
                        showError(
                            "Too many login attempts. Please wait a while before trying again."
                        );
                    } else {
                        showError(
                            "Unable to log in right now. " +
                            error.message
                        );
                    }

                    return;
                }

                if (!data.session) {
                    showError(
                        "Login could not be completed. Please try again."
                    );
                    return;
                }

                successMessage.textContent =
                    "Login successful! Opening your dashboard...";
                successMessage.classList.add("show");

                loginButton.textContent = "Login Successful";

                window.location.href = "dashboard.html";

            } catch (err) {
                console.error("Login error:", err);

                showError(
                    "Connection problem. Please check your internet connection and try again."
                );
            } finally {
                loginButton.disabled = false;

                if (!successMessage.classList.contains("show")) {
                    loginButton.textContent = "Login to Account";
                }
            }
        });
    </script>
</body>
</html>
