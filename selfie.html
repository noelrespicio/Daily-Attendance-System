<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Selfie</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
h2{text-align:center;margin-bottom:15px;}
.container{
  max-width:400px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  text-align:center;
}
img{
  width:100%;
  border-radius:10px;
  border:1px solid #ddd;
}
.back{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
}
.empty{color:#777;font-size:14px;}
</style>
</head>

<body>

<a href="javascript:window.close()" class="back">⬅ Back</a>

<h2>📸 Attendance Selfie</h2>

<div class="container" id="content">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
let selfieUrl = params.get("url");
const content = document.getElementById("content");

if(!selfieUrl || selfieUrl === "NULL"){
  content.innerHTML = `<div class="empty">No selfie available.</div>`;
}else{
  selfieUrl = decodeURIComponent(selfieUrl);
  content.innerHTML = `
    <img src="${selfieUrl}" 
         alt="Attendance Selfie"
         onerror="this.onerror=null;this.src='https://via.placeholder.com/300x400?text=Image+Not+Found';">
  `;
}
</script>

</body>
</html>
