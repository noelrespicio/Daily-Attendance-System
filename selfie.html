<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Selfie</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}

h2{
  text-align:center;
  margin-bottom:15px;
}

.container{
  max-width:420px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
  text-align:center;
}

.img-wrapper{
  position:relative;
}

img{
  width:100%;
  border-radius:12px;
  border:1px solid #e5e7eb;
  object-fit:cover;
}

.loading{
  font-size:14px;
  color:#666;
}

.empty{
  color:#777;
  font-size:14px;
}

.back{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
}
.back:hover{background:#1d4ed8;}
</style>
</head>

<body>

<a href="javascript:window.close()" class="back">⬅ Back</a>

<h2>📸 Attendance Selfie</h2>

<div class="container" id="content">
  <div class="loading">Loading image...</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let selfieUrl = params.get("url");

const content = document.getElementById("content");

if(!selfieUrl || selfieUrl === "NULL"){
  content.innerHTML = `<div class="empty">No selfie available.</div>`;
}else{
  selfieUrl = decodeURIComponent(selfieUrl);

  const img = new Image();
  img.src = selfieUrl;
  img.alt = "Attendance Selfie";

  img.onerror = () => {
    img.src = "https://via.placeholder.com/300x400?text=Image+Not+Found";
  };

  img.onload = () => {
    content.innerHTML = "";
    content.appendChild(img);
  };
}
</script>

</body>
</html>
