<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Selfie</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
h2{
  text-align:center;
  margin-bottom:15px;
}
.container{
  max-width:400px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  text-align:center;
}
img{
  width:100%;
  border-radius:10px;
  border:1px solid #ddd;
}
.back{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
}
.empty{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<a href="javascript:window.close()" class="back">⬅ Back</a>

<h2>📸 Attendance Selfie</h2>

<div class="container" id="content">
  Loading...
</div>

<script>
// Get URL parameter
const params = new URLSearchParams(window.location.search);
let selfieUrl = params.get("url");

// Container div
const content = document.getElementById("content");

// If selfie URL is missing, NULL, or empty
if(!selfieUrl || selfieUrl.toUpperCase() === "NULL"){
  content.innerHTML = `<div class="empty">No selfie available.</div>`;
}else{
  // Decode the URL if it was encoded
  selfieUrl = decodeURIComponent(selfieUrl);

  // Show the image
  content.innerHTML = `
    <img src="${selfieUrl}" alt="Attendance Selfie" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x400?text=No+Image';">
  `;
}
</script>

</body>
</html>
