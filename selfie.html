<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Selfie</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
h2{
  text-align:center;
  margin-bottom:15px;
}
.container{
  max-width:400px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  text-align:center;
}
img{
  width:100%;
  border-radius:10px;
  border:1px solid #ddd;
}
.info{
  margin-top:10px;
  font-size:14px;
  color:#555;
}
.back{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
}
</style>
</head>

<body>

<a href="javascript:window.close()" class="back">⬅ Back</a>

<h2>📸 Attendance Selfie</h2>

<div class="container" id="content">
  Loading...
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  "https://wlthlwxcmltwescezjlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o"
);

const params = new URLSearchParams(window.location.search);
const attendanceId = params.get("id");

if(!attendanceId){
  document.getElementById("content").innerHTML = "Invalid attendance record.";
  throw new Error("No ID");
}

(async()=>{
  const { data, error } = await supabase
    .from("attendance")
    .select("selfie_url, time_in, time_out")
    .eq("id", attendanceId)
    .single();

  if(error || !data){
    document.getElementById("content").innerHTML = "Selfie not found.";
    return;
  }

  if(!data.selfie_url){
    document.getElementById("content").innerHTML = "No selfie captured.";
    return;
  }

  document.getElementById("content").innerHTML = `
    <img src="${data.selfie_url}" alt="Attendance Selfie">
    <div class="info">
      ${data.time_out 
        ? "🔴 Captured during Final Out"
        : "🟢 Captured during Time In"}
    </div>
  `;
})();
</script>

</body>
</html>
