<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Selfie</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  height: 100vh;
}
h2 {
  margin-bottom: 20px;
}
img {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
button {
  margin-top: 15px;
  padding: 10px 15px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
button:hover {
  background: #0056b3;
}
</style>
</head>
<body>

<h2>📸 My Selfie</h2>
<img id="selfieImage" src="" alt="Selfie">
<button onclick="goBack()">⬅ Back</button>

<script>
// Get URL parameter "url"
function getQueryParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(name);
}

const selfieUrl = getQueryParam("url");
const imgEl = document.getElementById("selfieImage");

if(selfieUrl) {
  imgEl.src = decodeURIComponent(selfieUrl);
} else {
  imgEl.alt = "No selfie found";
}

function goBack() {
  window.history.back();
}
</script>

</body>
</html>
