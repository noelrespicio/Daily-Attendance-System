<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance</title>

<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;padding:15px;}
h2{text-align:center;margin-bottom:20px;}
.date-picker{text-align:center;margin-bottom:15px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:13px;}
th{background:#f7f7f7;}
.cutoff{background:#e5e7eb;font-weight:bold;text-align:left;}
button{
  padding:5px 8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.edit{background:#2563eb;color:#fff;}
.locked{color:red;font-size:12px;}
</style>
</head>

<body>

<h2>📊 My Attendance</h2>

<div class="date-picker">
<label>Select Month: </label>
<input type="month" id="monthPicker">
</div>

<table id="attendanceTable">
<thead>
<tr>
<th>Date</th>
<th>IN</th>
<th>LB OUT</th>
<th>LB IN</th>
<th>CB OUT</th>
<th>CB IN</th>
<th>OUT</th>
<th>Edit</th>
</tr>
</thead>
<tbody>
<tr><td colspan="8">Select a month</td></tr>
</tbody>
</table>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://wlthlwxcmltwescezjlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o"
);

let user;

/* ================= AUTH ================= */
(async()=>{
  const { data } = await supabase.auth.getSession();
  if(!data.session){
    location.href="login.html";
    return;
  }
  user = data.session.user;

  const now = new Date();
  monthPicker.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  loadAttendance(monthPicker.value);
})();

monthPicker.addEventListener("change",e=>{
  loadAttendance(e.target.value);
});

/* ================= HELPERS ================= */
const t = v => v ? new Date(v).toLocaleTimeString('en-GB') : '--';

function getCutoff(date){
  return new Date(date).getDate() <= 15 ? "first" : "second";
}

/* ================= LOAD ================= */
async function loadAttendance(month){
  const tbody = document.querySelector("#attendanceTable tbody");
  tbody.innerHTML = `<tr><td colspan="8">Loading...</td></tr>`;

  const { data } = await supabase
    .from("attendance")
    .select("*")
    .eq("user_id", user.id)
    .gte("attendance_date", `${month}-01`)
    .lte("attendance_date", `${month}-31`)
    .order("attendance_date");

  if(!data || !data.length){
    tbody.innerHTML = `<tr><td colspan="8">No records</td></tr>`;
    return;
  }

  tbody.innerHTML = "";

  ["first","second"].forEach(cut=>{
    const rows = data.filter(r => getCutoff(r.attendance_date) === cut);
    if(!rows.length) return;

    tbody.innerHTML += `
      <tr class="cutoff">
        <td colspan="8">${cut === "first" ? "🟢 1–15" : "🔵 16–End"}</td>
      </tr>`;

    rows.forEach(r => tbody.innerHTML += rowHTML(r));
  });
}

/* ================= ROW ================= */
function rowHTML(d){
  const cutoff = getCutoff(d.attendance_date);
  const used = cutoff === "first" ? d.edit_count_1st : d.edit_count_2nd;
  const left = 5 - used;

  return `
  <tr>
    <td>${d.attendance_date}</td>
    <td>${t(d.time_in)}</td>
    <td>${t(d.lunch_break_out)}</td>
    <td>${t(d.lunch_break_in)}</td>
    <td>${t(d.coffee_break_out)}</td>
    <td>${t(d.coffee_break_in)}</td>
    <td>${t(d.time_out)}</td>
    <td>
      ${left > 0
        ? `<button class="edit" onclick="editTime(${d.id},'${cutoff}',${used})">Edit (${left})</button>`
        : `<span class="locked">Locked</span>`
      }
    </td>
  </tr>`;
}

/* ================= EDIT ================= */
window.editTime = async (id, cutoff, used)=>{
  if(used >= 5){
    alert("Edit limit reached");
    return;
  }

  const field = prompt("Which field? (time_in, lunch_break_out, lunch_break_in, coffee_break_out, coffee_break_in, time_out)");
  if(!field) return;

  const newTime = prompt("Enter time (HH:MM:SS)");
  if(!newTime) return;

  const countCol = cutoff === "first" ? "edit_count_1st" : "edit_count_2nd";

  const { error } = await supabase
    .from("attendance")
    .update({
      [field]: newTime,
      [countCol]: used + 1
    })
    .eq("id", id);

  if(error){
    alert("Update failed");
    console.error(error);
    return;
  }

  alert(`Saved! Remaining edits: ${4-used}`);
  monthPicker.dispatchEvent(new Event("change"));
};
</script>

</body>
</html>
