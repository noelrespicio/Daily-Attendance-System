<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance</title>

<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;padding:15px;}
h2{text-align:center;margin-bottom:20px;}
.date-picker{text-align:center;margin-bottom:15px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
th{background:#f7f7f7;}
.cutoff{background:#e5e7eb;font-weight:bold;text-align:left;}
button{padding:6px 10px;border:none;background:#2563eb;color:#fff;border-radius:5px;cursor:pointer;}
button:hover{background:#1e40af;}
button:disabled{background:#9ca3af;cursor:not-allowed;}
</style>
</head>

<body>

<h2>📊 My Attendance</h2>

<div class="date-picker">
<label>Select Month: </label>
<input type="month" id="monthPicker">
</div>

<table id="attendanceTable">
<thead>
<tr>
<th>Date</th>
<th>Time In</th>
<th>LB Out</th>
<th>LB In</th>
<th>CB Out</th>
<th>CB In</th>
<th>Time Out</th>
<th>Selfie</th>
<th>Map</th>
<th>Edit</th>
</tr>
</thead>
<tbody>
<tr><td colspan="10">Select a month</td></tr>
</tbody>
</table>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  "https://wlthlwxcmltwescezjlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o"
);

let user, currentMonth;

/* AUTH */
(async()=>{
  const { data } = await supabase.auth.getSession();
  if(!data.session){ location.href="login.html"; return; }
  user = data.session.user;

  const now = new Date();
  currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  document.getElementById("monthPicker").value = currentMonth;

  loadAttendance(currentMonth);
})();

/* LOAD */
async function loadAttendance(month){
  currentMonth = month;
  const tbody = document.querySelector("#attendanceTable tbody");
  tbody.innerHTML = "Loading...";

  const { data } = await supabase
    .from("attendance")
    .select("*")
    .eq("user_id", user.id)
    .gte("attendance_date", `${month}-01`)
    .lte("attendance_date", `${month}-31`)
    .order("attendance_date");

  if(!data || !data.length){
    tbody.innerHTML = `<tr><td colspan="10">No data</td></tr>`;
    return;
  }

  tbody.innerHTML = "";

  for(const row of data){
    const day = new Date(row.attendance_date).getDate();
    const cutoff = day <= 15 ? 1 : 2;

    const edits = await getCutoffEdits(cutoff);
    const disabled = edits >= 5;

    tbody.innerHTML += `
      <tr>
        <td>${row.attendance_date}</td>
        <td>${fmt(row.time_in)}</td>
        <td>${fmt(row.lunch_break_out)}</td>
        <td>${fmt(row.lunch_break_in)}</td>
        <td>${fmt(row.coffee_break_out)}</td>
        <td>${fmt(row.coffee_break_in)}</td>
        <td>${fmt(row.time_out)}</td>
        <td>${row.selfie_url ? '📸' : '--'}</td>
        <td>${row.latitude ? '📍' : '--'}</td>
        <td>
          <button ${disabled?'disabled':''}
            onclick="editAttendance('${row.id}',${cutoff})">
            Edit (${edits}/5)
          </button>
        </td>
      </tr>
    `;
  }
}

/* GET EDIT COUNT */
async function getCutoffEdits(cutoff){
  const { data } = await supabase
    .from("attendance_cutoff_edits")
    .select("edit_count")
    .eq("user_id", user.id)
    .eq("month", currentMonth)
    .eq("cutoff", cutoff)
    .maybeSingle();

  return data ? data.edit_count : 0;
}

/* EDIT */
window.editAttendance = async (attendanceId, cutoff)=>{
  const edits = await getCutoffEdits(cutoff);
  if(edits >= 5){
    alert("Edit limit reached for this cutoff");
    return;
  }

  // increment cutoff counter
  await supabase
    .from("attendance_cutoff_edits")
    .upsert({
      user_id: user.id,
      month: currentMonth,
      cutoff,
      edit_count: edits + 1
    });

  alert("Edit recorded");
  loadAttendance(currentMonth);
};

function fmt(v){
  return v ? new Date(v).toLocaleTimeString('en-US',{hour12:false}) : '--';
}
</script>


</body>
</html>
