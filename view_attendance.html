<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 24px 16px;
    color: #172033;
    background:
        radial-gradient(circle at top left, #3b82f6 0, transparent 35%),
        linear-gradient(135deg, #07152e, #163d72);
}

/* PAGE TITLE */
h2 {
    text-align: center;
    margin: 10px 0 25px;
    color: #ffffff;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: .3px;
}

/* DATE PICKER AREA */
.date-picker {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto 22px;
    padding: 20px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
}

.date-picker label {
    color: #334155;
    font-size: 14px;
    font-weight: 700;
}

.date-picker input,
.date-picker select {
    max-width: 100%;
    padding: 11px 13px;
    border: 1px solid #dbe3ef;
    border-radius: 10px;
    background: #f8fafc;
    color: #172033;
    font-size: 14px;
    outline: none;
    transition: .2s;
}

.date-picker input:focus,
.date-picker select:focus {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
}

/* BUTTONS */
button {
    padding: 10px 15px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, background .2s;
}

button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(37, 99, 235, .22);
}

button:active:not(:disabled) {
    transform: scale(.98);
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
    box-shadow: none;
}

/* TABLE WRAPPER */
.table-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    overflow-x: auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .2);
}

/* ATTENDANCE TABLE */
table {
    width: 100%;
    min-width: 750px;
    border-collapse: separate;
    border-spacing: 0;
    background: #ffffff;
}

th,
td {
    padding: 13px 10px;
    text-align: center;
    font-size: 13px;
    border-bottom: 1px solid #e5eaf1;
    border-right: 1px solid #edf0f5;
}

th {
    background: #eff6ff;
    color: #1e3a8a;
    font-weight: 800;
    white-space: nowrap;
}

td {
    color: #475569;
    background: #ffffff;
}

tbody tr:hover td {
    background: #f8fafc;
}

tr:last-child td {
    border-bottom: none;
}

/* CUTOFF SECTION ROW */
.cutoff {
    background: #dbeafe !important;
    color: #1e40af !important;
    font-weight: 800;
    text-align: left;
    padding: 13px 15px;
    border-top: 2px solid #bfdbfe;
    border-bottom: 1px solid #bfdbfe;
}

/* LINKS INSIDE TABLE */
table a {
    color: #2563eb;
    font-weight: 700;
    text-decoration: none;
}

table a:hover {
    text-decoration: underline;
}

/* MOBILE RESPONSIVENESS */
@media (max-width: 600px) {
    body {
        padding: 16px 10px;
    }

    h2 {
        font-size: 23px;
        margin-bottom: 20px;
    }

    .date-picker {
        flex-direction: column;
        align-items: stretch;
        padding: 17px;
        gap: 10px;
        border-radius: 15px;
    }

    .date-picker input,
    .date-picker select,
    .date-picker button {
        width: 100%;
    }

    .table-container {
        border-radius: 12px;
    }

    th,
    td {
        padding: 11px 8px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<h2>📊 My Attendance</h2>

<div class="date-picker">
<label>Select Month: </label>
<input type="month" id="monthPicker">
</div>

<table id="attendanceTable">
<thead>
<tr>
<th>Date</th>
<th>Time In</th>
<th>LB Out</th>
<th>LB In</th>
<th>CB Out</th>
<th>CB In</th>
<th>Time Out</th>
<th>Map</th>
<th>Edit</th>
</tr>
</thead>
<tbody>
<tr><td colspan="10">Select a month</td></tr>
</tbody>
</table>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  "https://oaorsmayfosxrfahkxgi.supabase.co",
  "sb_publishable_Vx0EZwKgcNMQNLpmb6RtKw_wpwZ15Bz"
);
let user;

/* ================= AUTH ================= */
(async()=>{
  const { data } = await supabase.auth.getSession();
  if(!data.session){
    alert("Not logged in!");
    location.href="login.html";
    return;
  }
  user = data.session.user;

  const now = new Date();
  document.getElementById("monthPicker").value =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  loadAttendance(document.getElementById("monthPicker").value);
})();

document.getElementById("monthPicker").addEventListener("change", e => {
  loadAttendance(e.target.value);
});

/* ================= LOAD ATTENDANCE ================= */
async function loadAttendance(month){
  const tbody = document.querySelector("#attendanceTable tbody");
  tbody.innerHTML = `<tr><td colspan="10">Loading...</td></tr>`;

const startDate = `${month}-01`;
const endDate = new Date(month + '-01');
endDate.setMonth(endDate.getMonth() + 1);
endDate.setDate(0); // last day of month

const end = endDate.toISOString().split('T')[0];

const { data, error } = await supabase
  .from("attendance")
  .select("*")
  .eq("user_id", user.id)
  .gte("attendance_date", startDate)
  .lte("attendance_date", end)
  .order("attendance_date", { ascending: true });



  let firstEdits = 0;
  let secondEdits = 0;

  data.forEach(d => {
    if(new Date(d.attendance_date).getDate() <= 15)
      firstEdits += d.edit_count || 0;
    else
      secondEdits += d.edit_count || 0;
  });

  tbody.innerHTML = "";

  const first = data.filter(d => new Date(d.attendance_date).getDate() <= 15);
  const second = data.filter(d => new Date(d.attendance_date).getDate() > 15);

  if(first.length){
    tbody.innerHTML += `<tr class="cutoff">
      <td colspan="10">🟢 1st Cutoff (1–15) — Edits used: ${firstEdits}/5</td>
    </tr>`;
    first.forEach(r => tbody.innerHTML += rowHTML(r, firstEdits, secondEdits));
  }

  if(second.length){
    tbody.innerHTML += `<tr class="cutoff">
      <td colspan="10">🔵 2nd Cutoff (16–End) — Edits used: ${secondEdits}/5</td>
    </tr>`;
    second.forEach(r => tbody.innerHTML += rowHTML(r, firstEdits, secondEdits));
  }
}

/* ================= ROW HTML ================= */
function rowHTML(d, firstTotal, secondTotal){
  const formatTime = v => v ? new Date(v).toLocaleTimeString('en-US',{hour12:false}) : '';
  const isFirst = new Date(d.attendance_date).getDate() <= 15;
  const disabled = isFirst ? firstTotal >= 5 : secondTotal >= 5;

  return `
  <tr id="row-${d.id}">
    <td>${d.attendance_date}</td>
    <td class="editable">${formatTime(d.time_in)}</td>
    <td class="editable">${formatTime(d.lunch_break_out)}</td>
    <td class="editable">${formatTime(d.lunch_break_in)}</td>
    <td class="editable">${formatTime(d.coffee_break_out)}</td>
    <td class="editable">${formatTime(d.coffee_break_in)}</td>
    <td class="editable">${formatTime(d.time_out)}</td>
    <td>${d.latitude ? `<button onclick="viewMap(${d.latitude},${d.longitude})">📍</button>` : '--'}</td>
    <td>
      <button ${disabled ? "disabled" : ""} onclick="startEdit('${d.id}')">✏️ Edit</button>
    </td>
  </tr>`;
}

/* ================= EDIT FUNCTIONS ================= */
window.startEdit = (id) => {
  const row = document.getElementById(`row-${id}`);
  const cells = row.querySelectorAll('.editable');

  // Convert cells to input fields
  cells.forEach(cell => {
    const value = cell.innerText;
    cell.innerHTML = `<input type="time" value="${value}">`;
  });

  // Replace edit button with save button
  const btnCell = row.querySelector('td:last-child');
  btnCell.innerHTML = `<button onclick="saveEdit('${id}')">💾 Save</button>`;
}

window.saveEdit = async (id) => {
  const row = document.getElementById(`row-${id}`);
  const inputs = row.querySelectorAll('input');

  const [time_in, lb_out, lb_in, cb_out, cb_in, time_out] = Array.from(inputs).map(i => i.value || null);

  // Fetch current edit_count
  const { data, error: fetchError } = await supabase
    .from('attendance')
    .select('edit_count')
    .eq('id', id)
    .single();

  if(fetchError){
    alert("Failed to fetch edit count");
    console.error(fetchError);
    return;
  }

  const currentCount = data.edit_count || 0;

  // Update the attendance
  const { error } = await supabase
    .from('attendance')
    .update({
      time_in,
      lunch_break_out: lb_out,
      lunch_break_in: lb_in,
      coffee_break_out: cb_out,
      coffee_break_in: cb_in,
      time_out,
      edit_count: currentCount + 1
    })
    .eq('id', id);

  if(error){
    alert("Failed to save attendance");
    console.error(error);
    return;
  }

  alert("Attendance updated successfully");
  location.reload();
}

/* ================= VIEWERS ================= */
window.viewMap = (lat,lng) => {
  window.open(`map.html?lat=${lat}&lng=${lng}`, "_blank");
};
</script>

</body>
</html>
