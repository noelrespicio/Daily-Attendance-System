
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 24px 16px;
    color: #172033;
    background:
        radial-gradient(circle at top left, #3b82f6 0, transparent 35%),
        linear-gradient(135deg, #07152e, #163d72);
}

h2 {
    text-align: center;
    margin: 10px 0 25px;
    color: #fff;
    font-size: 27px;
    font-weight: 800;
}

.date-picker {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto 22px;
    padding: 20px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
}

.date-picker label {
    color: #334155;
    font-size: 14px;
    font-weight: 700;
}

.date-picker input {
    max-width: 100%;
    padding: 11px 13px;
    border: 1px solid #dbe3ef;
    border-radius: 10px;
    background: #f8fafc;
    color: #172033;
    font-size: 14px;
    outline: none;
}

.date-picker input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

button {
    padding: 9px 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg,#3b82f6,#1d4ed8);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
    white-space: nowrap;
}

button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(37,99,235,.22);
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

button.cancel-btn {
    background: #64748b;
}

.table-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    overflow-x: auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,.2);
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: separate;
    border-spacing: 0;
    background: #fff;
}

th, td {
    padding: 12px 9px;
    text-align: center;
    font-size: 13px;
    border-bottom: 1px solid #e5eaf1;
    border-right: 1px solid #edf0f5;
}

th {
    background: #eff6ff;
    color: #1e3a8a;
    font-weight: 800;
    white-space: nowrap;
}

td {
    color: #475569;
    background: #fff;
}

tbody tr:hover td {
    background: #f8fafc;
}

.cutoff td {
    background: #dbeafe !important;
    color: #1e40af !important;
    font-weight: 800;
    text-align: left;
    padding: 13px 15px;
}

td input[type="time"] {
    width: 100px;
    max-width: 100%;
    padding: 7px 4px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 12px;
}

.status-message {
    padding: 22px;
    text-align: center;
    color: #64748b;
    font-weight: 600;
}

@media (max-width: 600px) {
    body {
        padding: 16px 10px;
    }

    h2 {
        font-size: 23px;
        margin-bottom: 20px;
    }

    .date-picker {
        flex-direction: column;
        align-items: stretch;
        padding: 17px;
        border-radius: 15px;
    }

    .date-picker input {
        width: 100%;
    }

    .table-container {
        border-radius: 12px;
    }

    th, td {
        padding: 10px 7px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<h2>📊 My Attendance</h2>

<div class="date-picker">
    <label for="monthPicker">Select Month:</label>
    <input type="month" id="monthPicker">
</div>

<div class="table-container">
    <table id="attendanceTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time In</th>
                <th>LB Out</th>
                <th>LB In</th>
                <th>CB Out</th>
                <th>CB In</th>
                <th>Time Out</th>
                <th>Map</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="9" class="status-message">Loading attendance...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    "https://oaorsmayfosxrfahkxgi.supabase.co",
    "sb_publishable_Vx0EZwKgcNMQNLpmb6RtKw_wpwZ15Bz"
);

let user = null;
let loading = false;

const monthPicker = document.getElementById("monthPicker");
const tbody = document.querySelector("#attendanceTable tbody");

function showMessage(message) {
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");

    td.colSpan = 9;
    td.className = "status-message";
    td.textContent = message;

    tr.appendChild(td);
    tbody.appendChild(tr);
}

function localDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function formatTime(value) {
    if (!value) return "";

    // Supabase TIME columns commonly return "HH:MM:SS".
    if (/^\d{2}:\d{2}/.test(value)) {
        return value.slice(0, 5);
    }

    // Handle timestamp values.
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });
}

function getDay(dateString) {
    // Avoid timezone shifts from parsing YYYY-MM-DD.
    return Number(dateString.slice(8, 10));
}

/* AUTHENTICATION */
async function initialize() {
    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
    }

    user = data.session.user;

    const now = new Date();
    monthPicker.value =
        `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

    await loadAttendance(monthPicker.value);
}

monthPicker.addEventListener("change", async () => {
    if (monthPicker.value && user) {
        await loadAttendance(monthPicker.value);
    }
});

/* LOAD ATTENDANCE */
async function loadAttendance(month) {
    if (!user || !month || loading) return;

    loading = true;
    showMessage("Loading attendance...");

    try {
        const [year, monthNumber] = month.split("-").map(Number);
        const startDate = `${month}-01`;
        const endDate = localDateString(
            new Date(year, monthNumber, 0)
        );

        const { data, error } = await supabase
            .from("attendance")
            .select("*")
            .eq("user_id", user.id)
            .gte("attendance_date", startDate)
            .lte("attendance_date", endDate)
            .order("attendance_date", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
            showMessage("No attendance records found for this month.");
            return;
        }

        const first = data.filter(d => getDay(d.attendance_date) <= 15);
        const second = data.filter(d => getDay(d.attendance_date) > 15);

        const firstEdits = first.reduce(
            (sum, d) => sum + (Number(d.edit_count) || 0), 0
        );

        const secondEdits = second.reduce(
            (sum, d) => sum + (Number(d.edit_count) || 0), 0
        );

        tbody.innerHTML = "";

        if (first.length) {
            addCutoffRow(
                `🟢 1st Cutoff (1–15) — Total edits used: ${firstEdits}`
            );

            first.forEach(record => {
                addAttendanceRow(record, firstEdits, secondEdits);
            });
        }

        if (second.length) {
            addCutoffRow(
                `🔵 2nd Cutoff (16–End) — Total edits used: ${secondEdits}`
            );

            second.forEach(record => {
                addAttendanceRow(record, firstEdits, secondEdits);
            });
        }
    } catch (error) {
        console.error("Load attendance error:", error);
        showMessage("Failed to load attendance. Please check your connection and database settings.");
    } finally {
        loading = false;
    }
}

function addCutoffRow(label) {
    const tr = document.createElement("tr");
    tr.className = "cutoff";

    const td = document.createElement("td");
    td.colSpan = 9;
    td.textContent = label;

    tr.appendChild(td);
    tbody.appendChild(tr);
}

function addAttendanceRow(record, firstEdits, secondEdits) {
    const tr = document.createElement("tr");
    tr.id = `row-${record.id}`;

    const values = [
        record.attendance_date,
        formatTime(record.time_in),
        formatTime(record.lunch_break_out),
        formatTime(record.lunch_break_in),
        formatTime(record.coffee_break_out),
        formatTime(record.coffee_break_in),
        formatTime(record.time_out)
    ];

    values.forEach((value, index) => {
        const td = document.createElement("td");
        td.textContent = value || "--";

        if (index >= 1 && index <= 6) {
            td.className = "editable";
        }

        tr.appendChild(td);
    });

    const mapCell = document.createElement("td");

    if (record.latitude != null && record.longitude != null) {
        const mapButton = document.createElement("button");
        mapButton.textContent = "📍 Map";
        mapButton.addEventListener("click", () => {
            window.open(
                `map.html?lat=${encodeURIComponent(record.latitude)}&lng=${encodeURIComponent(record.longitude)}`,
                "_blank",
                "noopener"
            );
        });
        mapCell.appendChild(mapButton);
    } else {
        mapCell.textContent = "--";
    }

    tr.appendChild(mapCell);

    const editCell = document.createElement("td");
    const day = getDay(record.attendance_date);
    const used = day <= 15 ? firstEdits : secondEdits;

    const editButton = document.createElement("button");
    editButton.textContent = "✏️ Edit";
    editButton.disabled = used >= 5;
    editButton.title = used >= 5
        ? "The edit limit has been reached."
        : "Edit this attendance record";

    editButton.addEventListener("click", () => {
        startEdit(record.id);
    });

    editCell.appendChild(editButton);
    tr.appendChild(editCell);

    tbody.appendChild(tr);
}

/* EDIT ATTENDANCE */
window.startEdit = function(id) {
    const row = document.getElementById(`row-${id}`);
    if (!row) return;

    const cells = row.querySelectorAll(".editable");

    cells.forEach(cell => {
        const input = document.createElement("input");
        input.type = "time";
        input.value = cell.textContent === "--" ? "" : cell.textContent;
        cell.textContent = "";
        cell.appendChild(input);
    });

    const actionCell = row.lastElementChild;
    actionCell.innerHTML = "";

    const saveButton = document.createElement("button");
    saveButton.textContent = "💾 Save";
    saveButton.addEventListener("click", () => saveEdit(id));

    const cancelButton = document.createElement("button");
    cancelButton.textContent = "Cancel";
    cancelButton.className = "cancel-btn";
    cancelButton.style.marginTop = "5px";
    cancelButton.addEventListener("click", () => {
        loadAttendance(monthPicker.value);
    });

    actionCell.append(saveButton, document.createElement("br"), cancelButton);
};

window.saveEdit = async function(id) {
    const row = document.getElementById(`row-${id}`);
    if (!row || !user) return;

    const inputs = row.querySelectorAll(".editable input");

    if (inputs.length !== 6) {
        alert("Unable to read the attendance fields. Please reload the page.");
        return;
    }

    const [
        time_in,
        lunch_break_out,
        lunch_break_in,
        coffee_break_out,
        coffee_break_in,
        time_out
    ] = Array.from(inputs).map(input => input.value || null);

    const saveButton = row.lastElementChild.querySelector("button");
    if (saveButton) saveButton.disabled = true;

    try {
        // Verify the record belongs to the logged-in user.
        const { data: record, error: fetchError } = await supabase
            .from("attendance")
            .select("id, user_id, attendance_date, edit_count")
            .eq("id", id)
            .eq("user_id", user.id)
            .single();

        if (fetchError) throw fetchError;

        const currentCount = Number(record.edit_count) || 0;

        // Count edits within the record's cutoff period.
        const day = getDay(record.attendance_date);
        const firstDay = `${record.attendance_date.slice(0, 7)}-01`;
        const [year, monthNumber] =
            record.attendance_date.slice(0, 7).split("-").map(Number);
        const lastDay = localDateString(new Date(year, monthNumber, 0));

        const rangeStart = day <= 15
            ? firstDay
            : `${record.attendance_date.slice(0, 7)}-16`;

        const rangeEnd = day <= 15
            ? `${record.attendance_date.slice(0, 7)}-15`
            : lastDay;

        const { data: cutoffRecords, error: countError } = await supabase
            .from("attendance")
            .select("edit_count")
            .eq("user_id", user.id)
            .gte("attendance_date", rangeStart)
            .lte("attendance_date", rangeEnd);

        if (countError) throw countError;

        const editsUsed = (cutoffRecords || []).reduce(
            (sum, item) => sum + (Number(item.edit_count) || 0), 0
        );

        if (editsUsed >= 5) {
            alert("You have reached the edit limit for this cutoff.");
            await loadAttendance(monthPicker.value);
            return;
        }

        const { error: updateError } = await supabase
            .from("attendance")
            .update({
                time_in,
                lunch_break_out,
                lunch_break_in,
                coffee_break_out,
                coffee_break_in,
                time_out,
                edit_count: currentCount + 1
            })
            .eq("id", id)
            .eq("user_id", user.id);

        if (updateError) throw updateError;

        alert("Attendance updated successfully!");
        await loadAttendance(monthPicker.value);
    } catch (error) {
        console.error("Save attendance error:", error);
        alert("Failed to save attendance. Check the database columns and RLS policies.");
        await loadAttendance(monthPicker.value);
    }
};

initialize();
</script>

</body>
</html>
