
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance</title>

<style>
/* ===============================
   GLOBAL DESIGN
================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --navy: #07152e;
    --text: #172033;
    --muted: #64748b;
    --border: #e5eaf2;
    --white: #ffffff;
    --light-blue: #eff6ff;
    --shadow: 0 20px 50px rgba(2, 12, 35, 0.20);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 35px 24px;
    color: var(--text);
    background:
        radial-gradient(ellipse at 10% 0%, rgba(59,130,246,.38), transparent 38%),
        radial-gradient(ellipse at 100% 100%, rgba(14,165,233,.20), transparent 35%),
        linear-gradient(135deg, #061126 0%, #102b52 50%, #173f70 100%);
    background-attachment: fixed;
}

/* ===============================
   PAGE TITLE
================================ */
h2 {
    width: fit-content;
    margin: 5px auto 30px;
    color: var(--white);
    font-size: clamp(25px, 3vw, 34px);
    font-weight: 800;
    letter-spacing: -1px;
    text-align: center;
    text-shadow: 0 4px 15px rgba(0,0,0,.18);
}

/* Optional subtitle if added to HTML */
.page-subtitle {
    margin: -18px auto 28px;
    color: #cbdaf0;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
}

/* ===============================
   MONTH SELECTOR CARD
================================ */
.date-picker {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 620px;
    margin: 0 auto 28px;
    padding: 24px;
    background: rgba(255,255,255,.97);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
}

.date-picker label {
    color: #334155;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .3px;
    text-transform: uppercase;
}

.date-picker input,
.date-picker select {
    min-height: 46px;
    max-width: 100%;
    padding: 12px 15px;
    border: 1px solid #dbe4f0;
    border-radius: 12px;
    outline: none;
    background: #f8fafc;
    color: #172033;
    font-size: 14px;
    font-weight: 600;
    transition: border-color .2s, box-shadow .2s, background .2s;
}

.date-picker input:hover,
.date-picker select:hover {
    border-color: #93b4f8;
}

.date-picker input:focus,
.date-picker select:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(37,99,235,.12);
}

/* ===============================
   BUTTONS
================================ */
button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 10px 14px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(37,99,235,.15);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 8px 18px rgba(37,99,235,.28);
}

button:active:not(:disabled) {
    transform: translateY(0) scale(.98);
}

button:focus-visible {
    outline: 3px solid rgba(96,165,250,.6);
    outline-offset: 3px;
}

button:disabled {
    background: #cbd5e1;
    color: #64748b;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
}

button.cancel-btn {
    background: #64748b;
    box-shadow: none;
}

button.cancel-btn:hover:not(:disabled) {
    background: #475569;
}

/* ===============================
   TABLE CARD
================================ */
.table-container {
    width: 100%;
    max-width: 1450px;
    margin: 0 auto;
    overflow: auto;
    background: var(--white);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 20px;
    box-shadow: var(--shadow);
    scrollbar-width: thin;
    scrollbar-color: #93b4f8 #f1f5f9;
}

.table-container::-webkit-scrollbar {
    height: 9px;
}

.table-container::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 20px;
}

.table-container::-webkit-scrollbar-thumb {
    background: #93b4f8;
    border-radius: 20px;
}

/* ===============================
   ATTENDANCE TABLE
================================ */
table {
    width: 100%;
    min-width: 950px;
    border-collapse: separate;
    border-spacing: 0;
    background: #fff;
}

thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 17px 13px;
    background: linear-gradient(135deg, #10294b, #1e477b);
    color: #fff;
    border-right: 1px solid rgba(255,255,255,.10);
    border-bottom: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1px;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
}

thead th:first-child {
    border-top-left-radius: 3px;
}

thead th:last-child {
    border-right: none;
}

th,
td {
    padding: 15px 12px;
    border-right: 1px solid #edf1f7;
    border-bottom: 1px solid #e9eef5;
    text-align: center;
    font-size: 13px;
}

td {
    color: #475569;
    background: #fff;
    font-weight: 500;
    white-space: nowrap;
}

td:first-child {
    color: #1e293b;
    font-weight: 700;
}

tbody tr {
    transition: background .2s ease;
}

tbody tr:hover td {
    background: #f3f7ff;
}

tbody tr:last-child td {
    border-bottom: none;
}

tbody td:last-child,
thead th:last-child {
    border-right: none;
}

/* ===============================
   CUTOFF ROWS
================================ */
.cutoff td {
    padding: 15px 18px;
    background: linear-gradient(90deg, #dbeafe, #eff6ff) !important;
    color: #1e40af !important;
    border-top: 1px solid #bfdbfe;
    border-bottom: 1px solid #bfdbfe;
    border-right: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .25px;
    text-align: left;
}

/* ===============================
   EDIT TIME INPUTS
================================ */
td input[type="time"] {
    width: 112px;
    max-width: 100%;
    min-height: 36px;
    padding: 7px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    outline: none;
    background: #f8fafc;
    color: #172033;
    font-size: 12px;
    font-weight: 600;
    transition: .2s;
}

td input[type="time"]:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

/* ===============================
   STATUS / EMPTY STATE
================================ */
.status-message {
    padding: 35px 20px !important;
    color: var(--muted) !important;
    background: #fff !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    text-align: center !important;
}

/* ===============================
   TABLE LINKS
================================ */
table a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
}

table a:hover {
    color: var(--primary-dark);
    text-decoration: underline;
}

/* ===============================
   RESPONSIVE DESIGN
================================ */
@media (max-width: 768px) {
    body {
        padding: 25px 14px;
    }

    h2 {
        margin-bottom: 24px;
        letter-spacing: -.6px;
    }

    .date-picker {
        gap: 12px;
        padding: 20px;
        border-radius: 16px;
    }

    .table-container {
        border-radius: 15px;
    }

    thead th {
        padding: 14px 10px;
    }

    th,
    td {
        padding: 12px 9px;
        font-size: 12px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 20px 10px;
    }

    h2 {
        font-size: 24px;
        margin-bottom: 22px;
    }

    .date-picker {
        flex-direction: column;
        align-items: stretch;
        padding: 18px;
        gap: 10px;
    }

    .date-picker label {
        font-size: 12px;
    }

    .date-picker input,
    .date-picker select {
        width: 100%;
        min-height: 45px;
    }

    .table-container {
        border-radius: 12px;
    }

    button {
        padding: 9px 11px;
        font-size: 11px;
    }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
    }
}
</style>
</head>

<body>

<h2>📊 My Attendance</h2>

<div class="date-picker">
    <label for="monthPicker">Select Month:</label>
    <input type="month" id="monthPicker">
</div>

<div class="table-container">
    <table id="attendanceTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time In</th>
                <th>LB Out</th>
                <th>LB In</th>
                <th>CB Out</th>
                <th>CB In</th>
                <th>Time Out</th>
                <th>Map</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="9" class="status-message">Loading attendance...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    "https://oaorsmayfosxrfahkxgi.supabase.co",
    "sb_publishable_Vx0EZwKgcNMQNLpmb6RtKw_wpwZ15Bz"
);

let user = null;
let loading = false;

const monthPicker = document.getElementById("monthPicker");
const tbody = document.querySelector("#attendanceTable tbody");

function showMessage(message) {
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");

    td.colSpan = 9;
    td.className = "status-message";
    td.textContent = message;

    tr.appendChild(td);
    tbody.appendChild(tr);
}

function localDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function formatTime(value) {
    if (!value) return "";

    // Supabase TIME columns commonly return "HH:MM:SS".
    if (/^\d{2}:\d{2}/.test(value)) {
        return value.slice(0, 5);
    }

    // Handle timestamp values.
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });
}

function getDay(dateString) {
    // Avoid timezone shifts from parsing YYYY-MM-DD.
    return Number(dateString.slice(8, 10));
}

/* AUTHENTICATION */
async function initialize() {
    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
    }

    user = data.session.user;

    const now = new Date();
    monthPicker.value =
        `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

    await loadAttendance(monthPicker.value);
}

monthPicker.addEventListener("change", async () => {
    if (monthPicker.value && user) {
        await loadAttendance(monthPicker.value);
    }
});

/* LOAD ATTENDANCE */
async function loadAttendance(month) {
    if (!user || !month || loading) return;

    loading = true;
    showMessage("Loading attendance...");

    try {
        const [year, monthNumber] = month.split("-").map(Number);
        const startDate = `${month}-01`;
        const endDate = localDateString(
            new Date(year, monthNumber, 0)
        );

        const { data, error } = await supabase
            .from("attendance")
            .select("*")
            .eq("user_id", user.id)
            .gte("attendance_date", startDate)
            .lte("attendance_date", endDate)
            .order("attendance_date", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
            showMessage("No attendance records found for this month.");
            return;
        }

        const first = data.filter(d => getDay(d.attendance_date) <= 15);
        const second = data.filter(d => getDay(d.attendance_date) > 15);

        const firstEdits = first.reduce(
            (sum, d) => sum + (Number(d.edit_count) || 0), 0
        );

        const secondEdits = second.reduce(
            (sum, d) => sum + (Number(d.edit_count) || 0), 0
        );

        tbody.innerHTML = "";

        if (first.length) {
            addCutoffRow(
                `🟢 1st Cutoff (1–15) — Total edits used: ${firstEdits}`
            );

            first.forEach(record => {
                addAttendanceRow(record, firstEdits, secondEdits);
            });
        }

        if (second.length) {
            addCutoffRow(
                `🔵 2nd Cutoff (16–End) — Total edits used: ${secondEdits}`
            );

            second.forEach(record => {
                addAttendanceRow(record, firstEdits, secondEdits);
            });
        }
    } catch (error) {
        console.error("Load attendance error:", error);
        showMessage("Failed to load attendance. Please check your connection and database settings.");
    } finally {
        loading = false;
    }
}

function addCutoffRow(label) {
    const tr = document.createElement("tr");
    tr.className = "cutoff";

    const td = document.createElement("td");
    td.colSpan = 9;
    td.textContent = label;

    tr.appendChild(td);
    tbody.appendChild(tr);
}

function addAttendanceRow(record, firstEdits, secondEdits) {
    const tr = document.createElement("tr");
    tr.id = `row-${record.id}`;

    const values = [
        record.attendance_date,
        formatTime(record.time_in),
        formatTime(record.lunch_break_out),
        formatTime(record.lunch_break_in),
        formatTime(record.coffee_break_out),
        formatTime(record.coffee_break_in),
        formatTime(record.time_out)
    ];

    values.forEach((value, index) => {
        const td = document.createElement("td");
        td.textContent = value || "--";

        if (index >= 1 && index <= 6) {
            td.className = "editable";
        }

        tr.appendChild(td);
    });

    const mapCell = document.createElement("td");

    if (record.latitude != null && record.longitude != null) {
        const mapButton = document.createElement("button");
        mapButton.textContent = "📍 Map";
        mapButton.addEventListener("click", () => {
            window.open(
                `map.html?lat=${encodeURIComponent(record.latitude)}&lng=${encodeURIComponent(record.longitude)}`,
                "_blank",
                "noopener"
            );
        });
        mapCell.appendChild(mapButton);
    } else {
        mapCell.textContent = "--";
    }

    tr.appendChild(mapCell);

    const editCell = document.createElement("td");
    const day = getDay(record.attendance_date);
    const used = day <= 15 ? firstEdits : secondEdits;

    const editButton = document.createElement("button");
    editButton.textContent = "✏️ Edit";
    editButton.disabled = used >= 5;
    editButton.title = used >= 5
        ? "The edit limit has been reached."
        : "Edit this attendance record";

    editButton.addEventListener("click", () => {
        startEdit(record.id);
    });

    editCell.appendChild(editButton);
    tr.appendChild(editCell);

    tbody.appendChild(tr);
}

/* EDIT ATTENDANCE */
window.startEdit = function(id) {
    const row = document.getElementById(`row-${id}`);
    if (!row) return;

    const cells = row.querySelectorAll(".editable");

    cells.forEach(cell => {
        const input = document.createElement("input");
        input.type = "time";
        input.value = cell.textContent === "--" ? "" : cell.textContent;
        cell.textContent = "";
        cell.appendChild(input);
    });

    const actionCell = row.lastElementChild;
    actionCell.innerHTML = "";

    const saveButton = document.createElement("button");
    saveButton.textContent = "💾 Save";
    saveButton.addEventListener("click", () => saveEdit(id));

    const cancelButton = document.createElement("button");
    cancelButton.textContent = "Cancel";
    cancelButton.className = "cancel-btn";
    cancelButton.style.marginTop = "5px";
    cancelButton.addEventListener("click", () => {
        loadAttendance(monthPicker.value);
    });

    actionCell.append(saveButton, document.createElement("br"), cancelButton);
};

window.saveEdit = async function(id) {
    const row = document.getElementById(`row-${id}`);
    if (!row || !user) return;

    const inputs = row.querySelectorAll(".editable input");

    if (inputs.length !== 6) {
        alert("Unable to read the attendance fields. Please reload the page.");
        return;
    }

    const [
        time_in,
        lunch_break_out,
        lunch_break_in,
        coffee_break_out,
        coffee_break_in,
        time_out
    ] = Array.from(inputs).map(input => input.value || null);

    const saveButton = row.lastElementChild.querySelector("button");
    if (saveButton) saveButton.disabled = true;

    try {
        // Verify the record belongs to the logged-in user.
        const { data: record, error: fetchError } = await supabase
            .from("attendance")
            .select("id, user_id, attendance_date, edit_count")
            .eq("id", id)
            .eq("user_id", user.id)
            .single();

        if (fetchError) throw fetchError;

        const currentCount = Number(record.edit_count) || 0;

        // Count edits within the record's cutoff period.
        const day = getDay(record.attendance_date);
        const firstDay = `${record.attendance_date.slice(0, 7)}-01`;
        const [year, monthNumber] =
            record.attendance_date.slice(0, 7).split("-").map(Number);
        const lastDay = localDateString(new Date(year, monthNumber, 0));

        const rangeStart = day <= 15
            ? firstDay
            : `${record.attendance_date.slice(0, 7)}-16`;

        const rangeEnd = day <= 15
            ? `${record.attendance_date.slice(0, 7)}-15`
            : lastDay;

        const { data: cutoffRecords, error: countError } = await supabase
            .from("attendance")
            .select("edit_count")
            .eq("user_id", user.id)
            .gte("attendance_date", rangeStart)
            .lte("attendance_date", rangeEnd);

        if (countError) throw countError;

        const editsUsed = (cutoffRecords || []).reduce(
            (sum, item) => sum + (Number(item.edit_count) || 0), 0
        );

        if (editsUsed >= 5) {
            alert("You have reached the edit limit for this cutoff.");
            await loadAttendance(monthPicker.value);
            return;
        }

        const { error: updateError } = await supabase
            .from("attendance")
            .update({
                time_in,
                lunch_break_out,
                lunch_break_in,
                coffee_break_out,
                coffee_break_in,
                time_out,
                edit_count: currentCount + 1
            })
            .eq("id", id)
            .eq("user_id", user.id);

        if (updateError) throw updateError;

        alert("Attendance updated successfully!");
        await loadAttendance(monthPicker.value);
    } catch (error) {
        console.error("Save attendance error:", error);
        alert("Failed to save attendance. Check the database columns and RLS policies.");
        await loadAttendance(monthPicker.value);
    }
};

initialize();
</script>

</body>
</html>
