<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;padding:15px;}
.container{max-width:480px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.1);}
h2{text-align:center}
.clock{font-size:28px;text-align:center;margin:10px 0}
.date{text-align:center;color:#555}
table{width:100%;border-collapse:collapse;margin:15px 0;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
th{background:#f7f7f7}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;}
button{padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;background:#2563eb;color:#fff;}
button:disabled{background:#aaa;cursor:not-allowed;}
.cancel{text-align:center;margin-top:10px;display:none;}
.cancel button{background:#ef4444;}
.view-btn{width:100%;background:#059669;margin-top:10px;margin-top:10px;}
</style>
</head>
<body>
<div class="container">

<h2>📋 Daily Attendance</h2>
<div class="date" id="date"></div>
<div class="clock" id="clock"></div>

<table>
<tr><th>IN</th><th>LB OUT</th><th>LB IN</th></tr>
<tr>
<td id="time_in">--</td>
<td id="lbo">--</td>
<td id="lbi">--</td>
</tr>
</table>

<table>
<tr><th>CB OUT</th><th>CB IN</th><th>OUT</th></tr>
<tr>
<td id="cbo">--</td>
<td id="cbi">--</td>
<td id="time_out">--</td>
</tr>
</table>

<div class="buttons">
<button id="btn_time_in" onclick="record('time_in',true)">Time In</button>
<button id="btn_lbo" onclick="record('lunch_break_out',false)" disabled>LB Out</button>
<button id="btn_lbi" onclick="record('lunch_break_in',false)" disabled>LB In</button>
<button id="btn_cbo" onclick="record('coffee_break_out',false)" disabled>CB Out</button>
<button id="btn_cbi" onclick="record('coffee_break_in',false)" disabled>CB In</button>
<button id="btn_time_out" onclick="record('time_out',true)" disabled>Time Out</button>
</div>

<div class="cancel" id="cancelBox">
<p>Saving in <span id="count">5</span> seconds</p>
<button onclick="cancelSave()">Cancel</button>
</div>

<input type="file" id="selfieInput" accept="image/*" capture="user" hidden>
<button class="view-btn" onclick="location.href='view_attendance.html'">📊 View Attendance</button>
</div>

<script>
const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user, pendingField=null, pendingTime=null, countdown=null;
let seconds=5, locationData={}, selfieURL=null;

const sequence = ["time_in","lunch_break_out","lunch_break_in","coffee_break_out","coffee_break_in","time_out"];
const fieldMap = {time_in:"time_in",lunch_break_out:"lbo",lunch_break_in:"lbi",coffee_break_out:"cbo",coffee_break_in:"cbi",time_out:"time_out"};

/* CLOCK 24HR */
setInterval(()=>{
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString("en-GB");
  document.getElementById("date").innerText = now.toDateString();
},1000);

/* AUTH */
(async()=>{
  const { data } = await supabaseClient.auth.getSession();
  if(!data.session){ location.href="login.html"; return;}
  user = data.session.user;
  await ensureToday();
  await loadToday();
})();

/* ENSURE TODAY */
async function ensureToday(){
  const today = new Date().toISOString().split("T")[0];
  const { data } = await supabaseClient.from("attendance")
    .select("id")
    .eq("user_id", user.id)
    .eq("attendance_date", today)
    .maybeSingle();
  if(!data){
    await supabaseClient.from("attendance").insert({user_id:user.id,attendance_date:today});
  }
}

/* GET LOCATION */
function getLocation(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      pos=>res({lat:pos.coords.latitude,lng:pos.coords.longitude}),
      err=>rej("Location permission denied")
    );
  });
}

/* RECORD */
async function record(field, selfieRequired){
  // Check sequential
  const idx = sequence.indexOf(field);
  for(let i=0;i<idx;i++){
    if(document.getElementById(fieldMap[sequence[i]]).innerText=="--"){
      alert(`Please complete ${sequence[i].replace(/_/g," ").toUpperCase()} first`);
      return;
    }
  }

  pendingField = field;
  pendingTime = new Date().toISOString();

  // Only selfie for Time In & Time Out
  if(selfieRequired){
    try{ locationData = await getLocation(); } 
    catch(e){ alert(e); locationData={lat:null,lng:null}; }
    document.getElementById("selfieInput").click();
  } else {
    startCountdown(field);
  }
}

/* SELFIE */
document.getElementById("selfieInput").addEventListener("change",async e=>{
  const file = e.target.files[0]; 
  if(!file){pendingField=null; return;}
  const path=`${user.id}/${Date.now()}.jpg`;
  await supabaseClient.storage.from("selfies").upload(path,file,{upsert:true});
  selfieURL = supabaseClient.storage.from("selfies").getPublicUrl(path).data.publicUrl;
  startCountdown(pendingField);
});

/* COUNTDOWN */
function startCountdown(field){
  document.getElementById(fieldMap[field]).innerText = new Date(pendingTime).toLocaleTimeString("en-GB");
  seconds=5; document.getElementById("count").innerText=seconds;
  document.getElementById("cancelBox").style.display="block";

  countdown = setInterval(async()=>{
    seconds--;
    document.getElementById("count").innerText = seconds;
    if(seconds<=0){
      clearInterval(countdown);
      document.getElementById("cancelBox").style.display="none";
      await save();
    }
  },1000);
}

/* SAVE */
async function save(){
  const today = new Date().toISOString().split("T")[0];
  const payload = {[pendingField]: pendingTime};
  if(pendingField==="time_in" || pendingField==="time_out"){
    payload.latitude = locationData.lat;
    payload.longitude = locationData.lng;
    payload.selfie_url = selfieURL;
  }
  await supabaseClient.from("attendance")
    .update(payload)
    .eq("user_id", user.id)
    .eq("attendance_date", today);

  document.getElementById(fieldMap[pendingField]).innerText = new Date(pendingTime).toLocaleTimeString("en-GB");
  document.getElementById("btn_"+pendingField).disabled=true;

  // Enable next button in sequence
  const idx = sequence.indexOf(pendingField);
  if(idx < sequence.length-1){
    document.getElementById("btn_"+sequence[idx+1]).disabled=false;
  }
  pendingField=null;
}

/* CANCEL */
function cancelSave(){
  clearInterval(countdown);
  if(pendingField) document.getElementById(fieldMap[pendingField]).innerText="--";
  pendingField=null;
  document.getElementById("cancelBox").style.display="none";
}

/* LOAD TODAY */
async function loadToday(){
  const today = new Date().toISOString().split("T")[0];
  const {data} = await supabaseClient.from("attendance")
    .select("*")
    .eq("user_id",user.id)
    .eq("attendance_date",today)
    .maybeSingle();
  if(!data) return;

  sequence.forEach((f,i)=>{
    if(data[f]){
      document.getElementById(fieldMap[f]).innerText = new Date(data[f]).toLocaleTimeString("en-GB");
      document.getElementById("btn_"+f).disabled = true;

      // enable next button if previous is done
      if(i < sequence.length-1) document.getElementById("btn_"+sequence[i+1]).disabled = false;
    }
  });
}
</script>
</body>
</html>
