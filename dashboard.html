<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Daily Time Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard {
            width: 100%;
            max-width: 900px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .date {
            text-align: center;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .clock {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background: rgba(255,255,255,0.15);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        button {
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #1e3c72;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); }

        .cancel-box {
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .cancel-box button {
            background: #ff4d4d;
            color: #fff;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>

    <table>
        <thead>
            <tr>
                <th>Time In</th>
                <th>LB Out</th>
                <th>LB In</th>
                <th>CB Out</th>
                <th>CB In</th>
                <th>Final Out</th>
            </tr>
        </thead>
        <tbody>
            <tr id="attendanceRow">
                <td id="time_in">--:--</td>
                <td id="lbo">--:--</td>
                <td id="lbi">--:--</td>
                <td id="cbo">--:--</td>
                <td id="cbi">--:--</td>
                <td id="time_out">--:--</td>
            </tr>
        </tbody>
    </table>

    <div class="buttons">
        <button onclick="recordTime('time_in')">Time In</button>
        <button onclick="recordTime('lunch_break_out')">LB Out</button>
        <button onclick="recordTime('lunch_break_in')">LB In</button>
        <button onclick="recordTime('coffee_break_out')">CB Out</button>
        <button onclick="recordTime('coffee_break_in')">CB In</button>
        <button onclick="recordTime('time_out')">Final Out</button>
    </div>

    <div class="cancel-box" id="cancelBox">
        <p>Time recorded. Cancel within <span id="countdown">5</span> seconds</p>
        <button onclick="cancelLast()">Cancel</button>
    </div>
</div>

<script>
// Supabase client
const supabase = supabase.createClient(
   const SUPABASE_URL = 'https://wlthlwxcmltwescezjlk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o';

);

// Clock & date
function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString();
    document.getElementById('date').textContent = now.toDateString();
}
setInterval(updateClock, 1000);
updateClock();

let lastAction = null;
let countdownTimer;
let seconds = 5;

async function recordTime(column) {
    const now = new Date();
    document.getElementById(column.replace('_','')).textContent = now.toLocaleTimeString();

    lastAction = column;
    seconds = 5;
    document.getElementById('countdown').textContent = seconds;
    document.getElementById('cancelBox').style.display = 'block';

    countdownTimer = setInterval(() => {
        seconds--;
        document.getElementById('countdown').textContent = seconds;
        if (seconds === 0) {
            clearInterval(countdownTimer);
            document.getElementById('cancelBox').style.display = 'none';
        }
    }, 1000);
}

function cancelLast() {
    if (!lastAction) return;
    document.getElementById(lastAction.replace('_','')).textContent = '--:--';
    clearInterval(countdownTimer);
    document.getElementById('cancelBox').style.display = 'none';
}
</script>
</body>
</html>
