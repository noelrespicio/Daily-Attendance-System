<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;padding:15px;}
.container{max-width:480px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.1);}
h2{text-align:center;margin-bottom:15px;}
.clock{font-size:28px;text-align:center;margin:10px 0;}
.date{text-align:center;color:#555;margin-bottom:15px;}
table{width:100%;border-collapse:collapse;margin:15px 0;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
th{background:#f7f7f7;}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;}
button{padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;background:#2563eb;color:#fff;}
button:disabled{background:#aaa;cursor:not-allowed;}
.cancel{text-align:center;margin-top:10px;display:none;}
.cancel button{background:#ef4444;color:#fff;padding:8px 15px;border:none;border-radius:6px;cursor:pointer;}
.view-btn{width:100%;background:#059669;margin-top:15px;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;}
.header{
  display:flex;
  justify-content:space-between; /* LEFT */
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.buttons button:last-child{
  grid-column:span 2;
  background:#f59e0b;
}
.logout-btn{
  background:#ef4444;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.logout-btn:hover{
  background:#dc2626;
}

</style>
</head>
<body>
<div class="container">
  <button class="logout-btn" onclick="logout()">Logout</button>
<h2>📋 Daily Attendance</h2>
<div class="date" id="date"></div>
<div class="clock" id="clock"></div>

<table>
<tr><th>IN</th><th>LB OUT</th><th>LB IN</th></tr>
<tr>
<td id="time_in">--</td>
<td id="lbo">--</td>
<td id="lbi">--</td>
</tr>
</table>

<table>
<tr><th>CB OUT</th><th>CB IN</th><th>OUT</th></tr>
<tr>
<td id="cbo">--</td>
<td id="cbi">--</td>
<td id="time_out">--</td>
</tr>
</table>

<div class="buttons">
<button id="btn_time_in" onclick="record('time_in',true)">Time In</button>
<button id="btn_lbo" onclick="record('lunch_break_out',false)">LB Out</button>
<button id="btn_lbi" onclick="record('lunch_break_in',false)">LB In</button>
<button id="btn_cbo" onclick="record('coffee_break_out',false)">CB Out</button>
<button id="btn_cbi" onclick="record('coffee_break_in',false)">CB In</button>
<button id="btn_time_out" onclick="record('time_out',true)">Time Out</button>
<button onclick="location.href='sellout_inventory.html'">📦 Sellout</button>
</div>

<div class="cancel" id="cancelBox">
<p>Saving in <span id="count">5</span> seconds</p>
<button onclick="cancelSave()">Cancel</button>
</div>

<button class="view-btn" onclick="location.href='view_attendance.html'">📊 View Attendance</button>
</div>


<script>
const SUPABASE_URL = "https://oaorsmayfosxrfahkxgi.supabase.co";
const SUPABASE_KEY = "sb_publishable_Vx0EZwKgcNMQNLpmb6RtKw_wpwZ15Bz";
const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let pendingField = null;
let pendingTime = null;
let countdown = null;
let seconds = 5;
let locationData = {};

const fieldMap = {
  time_in: "time_in",
  lunch_break_out: "lbo",
  lunch_break_in: "lbi",
  coffee_break_out: "cbo",
  coffee_break_in: "cbi",
  time_out: "time_out"
};

function getLocalDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function toLocalString(date) {
  const pad = n => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

/* CLOCK */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString("en-US", { hour12: false });
  document.getElementById("date").innerText = now.toDateString();
}
updateClock();
setInterval(updateClock, 1000);

/* AUTH */
(async function init() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error || !data.session) {
    location.href = "login.html";
    return;
  }

  user = data.session.user;

  const ok = await ensureToday();
  if (ok) await loadToday();
})();

/* ENSURE TODAY'S ROW EXISTS */
async function ensureToday() {
  const today = getLocalDate();

  const { data, error } = await supabaseClient
    .from("attendance")
    .select("id")
    .eq("user_id", user.id)
    .eq("attendance_date", today)
    .maybeSingle();

  if (error) {
    console.error("Attendance lookup error:", error);
    alert("Hindi mabasa ang attendance: " + error.message);
    return false;
  }

  if (data) return true;

  const { error: insertError } = await supabaseClient
    .from("attendance")
    .insert({
      user_id: user.id,
      attendance_date: today
    });

  if (insertError) {
    // If another request already created today's row, verify it.
    const { data: existing, error: checkError } = await supabaseClient
      .from("attendance")
      .select("id")
      .eq("user_id", user.id)
      .eq("attendance_date", today)
      .maybeSingle();

    if (checkError || !existing) {
      console.error("Create attendance error:", insertError);
      alert("Hindi makagawa ng attendance record: " + insertError.message);
      return false;
    }
  }

  return true;
}

/* GET GPS LOCATION */
function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Hindi supported ang GPS sa browser na ito."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      }),
      err => reject(new Error(err.message)),
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  });
}

/* RECORD BUTTON */
async function record(field, locationRequired) {
  if (!user) {
    alert("Hindi pa naka-login. Mag-login muna.");
    return;
  }

  if (countdown) {
    alert("May pending attendance action pa. I-cancel o hintaying matapos.");
    return;
  }

  pendingField = field;
  pendingTime = new Date();
  locationData = {};

  if (locationRequired) {
    try {
      locationData = await getLocation();
    } catch (err) {
      pendingField = null;
      pendingTime = null;
      alert("Kailangan ang location para sa Time In/Out.\n" + err.message);
      return;
    }
  }

  startCountdown(field);
}

/* COUNTDOWN */
function startCountdown(field) {
  document.getElementById(fieldMap[field]).innerText =
    pendingTime.toLocaleTimeString("en-US", { hour12: false });

  seconds = 5;
  document.getElementById("count").innerText = seconds;
  document.getElementById("cancelBox").style.display = "block";

  countdown = setInterval(async () => {
    seconds--;
    document.getElementById("count").innerText = seconds;

    if (seconds <= 0) {
      clearInterval(countdown);
      countdown = null;
      document.getElementById("cancelBox").style.display = "none";
      await save();
    }
  }, 1000);
}

/* SAVE ATTENDANCE */
async function save() {
  if (!pendingField || !pendingTime || !user) return;

  const field = pendingField;
  const today = getLocalDate();

  const payload = {
    [field]: toLocalString(pendingTime)
  };

  if (field === "time_in" || field === "time_out") {
    payload.latitude = locationData.lat;
    payload.longitude = locationData.lng;
  }

  // Update today's existing row.
  const { data, error } = await supabaseClient
    .from("attendance")
    .update(payload)
    .eq("user_id", user.id)
    .eq("attendance_date", today)
    .select("id");

  if (error) {
    console.error("Attendance save error:", error);
    alert("Save failed: " + error.message);
    document.getElementById(fieldMap[field]).innerText = "--";
    pendingField = null;
    pendingTime = null;
    locationData = {};
    return;
  }

  if (!data || data.length === 0) {
    alert(
      "Walang attendance row na na-update. " +
      "Tingnan ang attendance table, user_id, petsa, at RLS policies."
    );
    document.getElementById(fieldMap[field]).innerText = "--";
    pendingField = null;
    pendingTime = null;
    locationData = {};
    return;
  }

  await loadToday();
  alert("Attendance saved successfully!");

  pendingField = null;
  pendingTime = null;
  locationData = {};
}

/* CANCEL */
function cancelSave() {
  if (countdown) clearInterval(countdown);
  countdown = null;

  if (pendingField) {
    document.getElementById(fieldMap[pendingField]).innerText = "--";
  }

  pendingField = null;
  pendingTime = null;
  locationData = {};
  document.getElementById("cancelBox").style.display = "none";
}

/* LOAD TODAY */
async function loadToday() {
  const today = getLocalDate();

  const { data, error } = await supabaseClient
    .from("attendance")
    .select("*")
    .eq("user_id", user.id)
    .eq("attendance_date", today)
    .maybeSingle();

  if (error) {
    console.error("Load attendance error:", error);
    alert("Hindi ma-load ang attendance: " + error.message);
    return;
  }

  if (!data) return;

  Object.keys(fieldMap).forEach(field => {
    const value = data[field];
    document.getElementById(fieldMap[field]).innerText = value
      ? String(value).includes("T")
        ? String(value).split("T")[1].substring(0, 8)
        : value
      : "--";
  });
}

/* LOGOUT */
async function logout() {
  if (!confirm("Are you sure you want to logout?")) return;

  await supabaseClient.auth.signOut();
  location.href = "login.html";
}
</script>

</body>
</html>
