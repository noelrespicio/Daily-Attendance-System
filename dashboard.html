<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | Daily Time Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { min-height:100vh; background:linear-gradient(135deg,#1e3c72,#2a5298); color:#fff; display:flex; justify-content:center; align-items:center; }
.dashboard { width:100%; max-width:900px; background:rgba(255,255,255,0.12); backdrop-filter:blur(12px); padding:30px; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
.date { text-align:center; font-size:18px; margin-bottom:5px; }
.clock { text-align:center; font-size:42px; font-weight:bold; margin-bottom:25px; }
table { width:100%; border-collapse:collapse; margin-bottom:25px; }
th, td { border:1px solid rgba(255,255,255,0.3); padding:12px; text-align:center; font-size:14px; }
th { background:rgba(255,255,255,0.15); }
.buttons { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:15px; }
button { padding:14px; border:none; border-radius:30px; font-weight:600; cursor:pointer; background:#fff; color:#1e3c72; transition:0.3s; }
button:hover:not(:disabled){ transform:translateY(-2px); }
button:disabled { opacity:0.5; cursor:not-allowed; }
.cancel-box { margin-top:10px; text-align:center; display:none; }
.cancel-box button { background:#ff4d4d; color:#fff; margin-top:10px; }
</style>
</head>
<body>

<div class="dashboard">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>

    <table>
        <thead>
            <tr>
                <th>Time In</th>
                <th>LB Out</th>
                <th>LB In</th>
                <th>CB Out</th>
                <th>CB In</th>
                <th>Final Out</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td id="time_in">--:--</td>
                <td id="lbo">--:--</td>
                <td id="lbi">--:--</td>
                <td id="cbo">--:--</td>
                <td id="cbi">--:--</td>
                <td id="time_out">--:--</td>
            </tr>
        </tbody>
    </table>

    <div class="buttons">
        <button id="btn_time_in" onclick="recordTime('time_in')">Time In</button>
        <button id="btn_lbo" onclick="recordTime('lunch_break_out')">LB Out</button>
        <button id="btn_lbi" onclick="recordTime('lunch_break_in')">LB In</button>
        <button id="btn_cbo" onclick="recordTime('coffee_break_out')">CB Out</button>
        <button id="btn_cbi" onclick="recordTime('coffee_break_in')">CB In</button>
        <button id="btn_time_out" onclick="recordTime('time_out')">Final Out</button>
    </div>

    <div class="cancel-box" id="cancelBox">
        <p>Time recorded. Cancel within <span id="countdown">5</span> seconds</p>
        <button onclick="cancelLast()">Cancel</button>
    </div>

    <button onclick="window.location.href='view_attendance.html'" style="width:100%;background:#00e6e6;color:#003;margin-top:10px;">
        📄 View Attendance
    </button>
</div>

<script>
/* ===== USER & SUPABASE ===== */
/* ===== GET AUTHENTICATED USER ===== */
let USER_ID = null;

async function getUser() {
    const { data: { user }, error } = await supabase.auth.getUser();
    if (error || !user) {
        alert("You are not logged in! Redirecting to login page...");
        window.location.href = "login.html"; // change to your login page
        return;
    }
    USER_ID = user.id; // this is unique per logged-in user
    ensureTodayRow().then(loadTodayAttendance);
}

/* ===== ENSURE TODAY ROW ===== */
async function ensureTodayRow() {
    if (!USER_ID) return;
    const today = new Date().toISOString().split("T")[0];
    const { data } = await supabase
        .from("attendance")
        .select("id")
        .eq("user_id", USER_ID)
        .eq("attendance_date", today)
        .single();

    if (!data) {
        await supabase.from("attendance").insert({ user_id: USER_ID, attendance_date: today });
    }
}

/* ===== LOAD TODAY ATTENDANCE ===== */
async function loadTodayAttendance() {
    if (!USER_ID) return;
    const today = new Date().toISOString().split("T")[0];
    const { data } = await supabase
        .from("attendance")
        .select("*")
        .eq("user_id", USER_ID)
        .eq("attendance_date", today)
        .single();

    if (!data) return;

    for (const col in cellMap) {
        if (data[col]) {
            document.getElementById(cellMap[col]).textContent = formatTime(data[col]);
            disableButton(col);
        }
    }
}

/* ===== INIT ===== */
getUser();


const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== CLOCK & DATE ===== */
function updateClock() {
    const now = new Date();
    document.getElementById("date").textContent = now.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    document.getElementById("clock").textContent = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
}
setInterval(updateClock, 1000);
updateClock();

/* ===== BUTTON MAP ===== */
const buttonMap = {
    time_in: "btn_time_in",
    lunch_break_out: "btn_lbo",
    lunch_break_in: "btn_lbi",
    coffee_break_out: "btn_cbo",
    coffee_break_in: "btn_cbi",
    time_out: "btn_time_out"
};

const cellMap = {
    time_in: "time_in",
    lunch_break_out: "lbo",
    lunch_break_in: "lbi",
    coffee_break_out: "cbo",
    coffee_break_in: "cbi",
    time_out: "time_out"
};


/* ===== RECORD TIME ===== */
async function recordTime(column) {
    if (pendingColumn) return; // prevent multiple clicks during countdown

    const now = new Date();
    pendingTime = now.toISOString();
    pendingColumn = column;

    document.getElementById(cellMap[column]).textContent = formatTime(pendingTime);
    seconds = 5;
    document.getElementById("countdown").textContent = seconds;
    document.getElementById("cancelBox").style.display = "block";

    clearInterval(countdownTimer);
    countdownTimer = setInterval(async () => {
        seconds--;
        document.getElementById("countdown").textContent = seconds;

        if (seconds <= 0) {
            clearInterval(countdownTimer);
            document.getElementById("cancelBox").style.display = "none";
            await saveToSupabase();
            pendingColumn = null;
            pendingTime = null;
        }
    }, 1000);
}

/* ===== SAVE TO SUPABASE ===== */
async function saveToSupabase() {
    const today = new Date().toISOString().split("T")[0];
    const updateData = {};
    updateData[pendingColumn] = pendingTime;

    await supabase
        .from("attendance")
        .update(updateData)
        .eq("user_id", USER_ID)
        .eq("attendance_date", today);

    disableButton(pendingColumn);
}

/* ===== CANCEL LAST ===== */
function cancelLast() {
    if (!pendingColumn) return;

    document.getElementById(cellMap[pendingColumn]).textContent = "--:--";
    pendingColumn = null;
    pendingTime = null;
    clearInterval(countdownTimer);
    document.getElementById("cancelBox").style.display = "none";
}

/* ===== BUTTON HELPERS ===== */
function disableButton(column) {
    const btn = document.getElementById(buttonMap[column]);
    if (btn) btn.disabled = true;
}

function enableButton(column) {
    const btn = document.getElementById(buttonMap[column]);
    if (btn) btn.disabled = false;
}

/* ===== INIT ===== */
ensureTodayRow().then(loadTodayAttendance);
</script>
</body>
</html>
