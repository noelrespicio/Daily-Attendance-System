<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Dashboard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

#date {
  font-size: 1.2rem;
  font-weight: bold;
}

#clock {
  font-size: 2rem;
  margin-top: 5px;
}

.table {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.cell {
  background: #fff;
  padding: 10px;
  border-radius: 6px;
  text-align: center;
  font-size: 0.85rem;
}

.cell strong {
  display: block;
  margin-bottom: 4px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.cancel {
  background: #dc3545;
}

button:disabled {
  background: #aaa;
}
</style>
</head>

<body>

<header>
  <div id="date"></div>
  <div id="clock"></div>
  <p>Welcome, <strong id="userEmail"></strong></p>
</header>

<!-- ATTENDANCE ROW -->
<div class="table">
  <div class="cell"><strong>Time In</strong><span id="time_in">--</span></div>
  <div class="cell"><strong>Time Out</strong><span id="time_out">--</span></div>
  <div class="cell"><strong>LB Out</strong><span id="lb_out">--</span></div>
  <div class="cell"><strong>LB In</strong><span id="lb_in">--</span></div>
  <div class="cell"><strong>CB Out</strong><span id="cb_out">--</span></div>
  <div class="cell"><strong>CB In</strong><span id="cb_in">--</span></div>
  <div class="cell"><strong>Final Out</strong><span id="final_out">--</span></div>
</div>

<!-- BUTTONS -->
<div class="buttons">
  <button onclick="mark('time_in')">TIME IN</button>
  <button onclick="mark('time_out')">TIME OUT</button>
  <button onclick="mark('lb_out')">LB OUT</button>
  <button onclick="mark('lb_in')">LB IN</button>
  <button onclick="mark('cb_out')">CB OUT</button>
  <button onclick="mark('cb_in')">CB IN</button>
  <button onclick="mark('final_out')">FINAL OUT</button>
</div>

<br>
<button class="cancel" onclick="cancelSave()" id="cancelBtn" disabled>
Cancel (5s)
</button>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://YOUR_PROJECT.supabase.co',
  'YOUR_PUBLIC_ANON_KEY'
);

let pendingField = null;
let timer = null;

const { data: sessionData } = await supabase.auth.getSession();
const user = sessionData.session?.user;

if (!user) location.href = "index.html";
document.getElementById("userEmail").textContent = user.email;

// DATE & CLOCK
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString('en-PH');
  document.getElementById("date").textContent =
    now.toLocaleDateString('en-PH',
      { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

// MARK TIME
window.mark = function(field) {
  if (pendingField) return;

  const now = new Date();
  const time = now.toLocaleTimeString('en-PH', { hour12:false });
  document.getElementById(field).textContent = time;

  pendingField = field;
  document.getElementById("cancelBtn").disabled = false;

  let seconds = 5;
  document.getElementById("cancelBtn").textContent = `Cancel (${seconds}s)`;

  timer = setInterval(async () => {
    seconds--;
    document.getElementById("cancelBtn").textContent = `Cancel (${seconds}s)`;

    if (seconds === 0) {
      clearInterval(timer);
      await saveToDB(field, time);
      resetCancel();
    }
  }, 1000);
};

// CANCEL
window.cancelSave = function() {
  if (!pendingField) return;
  document.getElementById(pendingField).textContent = "--";
  clearInterval(timer);
  resetCancel();
};

function resetCancel() {
  pendingField = null;
  document.getElementById("cancelBtn").disabled = true;
  document.getElementById("cancelBtn").textContent = "Cancel (5s)";
}

// SAVE TO DATABASE
async function saveToDB(field, time) {
  const today = new Date().toISOString().split('T')[0];

  const { data: existing } = await supabase
    .from('attendance')
    .select('*')
    .eq('user_id', user.id)
    .eq('date', today)
    .single();

  if (existing) {
    await supabase.from('attendance')
      .update({ [field]: time })
      .eq('id', existing.id);
  } else {
    await supabase.from('attendance').insert({
      user_id: user.id,
      email: user.email,
      date: today,
      [field]: time
    });
  }
}
</script>

</body>
</html>
