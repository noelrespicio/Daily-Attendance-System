<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Dashboard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

#date {
  font-size: 1.1rem;
  font-weight: bold;
}

#clock {
  font-size: 2rem;
  margin-top: 5px;
}

.table {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.cell {
  background: #fff;
  padding: 10px;
  border-radius: 6px;
  text-align: center;
  font-size: 0.85rem;
}

.cell strong {
  display: block;
  margin-bottom: 4px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.cancel {
  background: #dc3545;
}

button:disabled {
  background: #aaa;
}
</style>
</head>

<body>

<header>
  <div id="date"></div>
  <div id="clock"></div>
  <p>Welcome, <strong id="userEmail"></strong></p>
</header>

<!-- ATTENDANCE ROW -->
<div class="table">
  <div class="cell"><strong>Time In</strong><span id="time_in">--</span></div>
  <div class="cell"><strong>Time Out</strong><span id="time_out">--</span></div>
  <div class="cell"><strong>LB Out</strong><span id="lb_out">--</span></div>
  <div class="cell"><strong>LB In</strong><span id="lb_in">--</span></div>
  <div class="cell"><strong>CB Out</strong><span id="cb_out">--</span></div>
  <div class="cell"><strong>CB In</strong><span id="cb_in">--</span></div>
  <div class="cell"><strong>Final Out</strong><span id="final_out">--</span></div>
</div>

<!-- BUTTONS -->
<div class="buttons">
  <button onclick="mark('time_in')">TIME IN</button>
  <button onclick="mark('time_out')">TIME OUT</button>
  <button onclick="mark('lb_out')">LB OUT</button>
  <button onclick="mark('lb_in')">LB IN</button>
  <button onclick="mark('cb_out')">CB OUT</button>
  <button onclick="mark('cb_in')">CB IN</button>
  <button onclick="mark('final_out')">FINAL OUT</button>
</div>

<br>
<button class="cancel" onclick="cancelSave()" id="cancelBtn" disabled>
Cancel (5s)
</button>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  "https://wlthlwxcmltwescezjlk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o"
);

/* 🔧 CONFIG */
const OFFICE_LAT = 16.9333;
const OFFICE_LNG = 121.7667;
const ALLOWED_RADIUS = 100; // meters

let pendingField = null;
let timer = null;
let currentLocation = null;

/* AUTH */
const { data: sessionData } = await supabase.auth.getSession();
const user = sessionData.session?.user;
if (!user) location.href = "index.html";
document.getElementById("userEmail").textContent = user.email;

/* DATE & CLOCK */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString('en-PH');
  document.getElementById("date").textContent =
    now.toLocaleDateString('en-PH',
      { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

/* GEOLOCATION */
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(Δφ/2)**2 +
            Math.cos(φ1)*Math.cos(φ2) *
            Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function checkLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      const distance = getDistance(latitude, longitude, OFFICE_LAT, OFFICE_LNG);
      if (distance <= ALLOWED_RADIUS) {
        currentLocation = { latitude, longitude };
        resolve(true);
      } else {
        alert("❌ You are outside the allowed location");
        reject();
      }
    }, () => {
      alert("❌ Location access denied");
      reject();
    });
  });
}

/* LOAD TODAY DATA (PERSIST AFTER REFRESH) */
async function loadToday() {
  const today = new Date().toISOString().split('T')[0];
  const { data } = await supabase
    .from('attendance')
    .select('*')
    .eq('user_id', user.id)
    .eq('date', today)
    .single();

  if (data) {
    ['time_in','time_out','lb_out','lb_in','cb_out','cb_in','final_out']
      .forEach(f => {
        if (data[f]) document.getElementById(f).textContent = data[f];
      });
  }
}
await loadToday();

/* MARK TIME */
window.mark = async function(field) {
  if (pendingField) return;

  await checkLocation();

  const time = new Date().toLocaleTimeString('en-PH',{hour12:false});
  document.getElementById(field).textContent = time;
  pendingField = field;

  let seconds = 5;
  document.getElementById("cancelBtn").disabled = false;
  document.getElementById("cancelBtn").textContent = `Cancel (${seconds}s)`;

  timer = setInterval(async () => {
    seconds--;
    document.getElementById("cancelBtn").textContent = `Cancel (${seconds}s)`;
    if (seconds === 0) {
      clearInterval(timer);
      await saveToDB(field, time);
      reset();
    }
  }, 1000);
};

/* CANCEL */
window.cancelSave = function() {
  document.getElementById(pendingField).textContent = "--";
  clearInterval(timer);
  reset();
};

function reset() {
  pendingField = null;
  document.getElementById("cancelBtn").disabled = true;
  document.getElementById("cancelBtn").textContent = "Cancel (5s)";
}

/* SAVE */
async function saveToDB(field, time) {
  const today = new Date().toISOString().split('T')[0];

  const { data: existing } = await supabase
    .from('attendance')
    .select('*')
    .eq('user_id', user.id)
    .eq('date', today)
    .single();

  const payload = {
    [field]: time,
    latitude: currentLocation.latitude,
    longitude: currentLocation.longitude
  };

  if (existing) {
    await supabase.from('attendance').update(payload).eq('id', existing.id);
  } else {
    await supabase.from('attendance').insert({
      user_id: user.id,
      email: user.email,
      date: today,
      ...payload
    });
  }
}
</script>

</body>
</html>
