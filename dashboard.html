<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Daily Time Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard {
            width: 100%;
            max-width: 900px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .date {
            text-align: center;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .clock {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background: rgba(255,255,255,0.15);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        button {
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #1e3c72;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); }

        .cancel-box {
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .cancel-box button {
            background: #ff4d4d;
            color: #fff;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>

    <table>
        <thead>
            <tr>
                <th>Time In</th>
                <th>LB Out</th>
                <th>LB In</th>
                <th>CB Out</th>
                <th>CB In</th>
                <th>Final Out</th>
            </tr>
        </thead>
        <tbody>
            <tr id="attendanceRow">
                <td id="time_in">--:--</td>
                <td id="lbo">--:--</td>
                <td id="lbi">--:--</td>
                <td id="cbo">--:--</td>
                <td id="cbi">--:--</td>
                <td id="time_out">--:--</td>
            </tr>
        </tbody>
    </table>

   <div class="buttons">
    <button id="btn_time_in" onclick="recordTime('time_in')">Time In</button>
    <button id="btn_lbo" onclick="recordTime('lunch_break_out')">LB Out</button>
    <button id="btn_lbi" onclick="recordTime('lunch_break_in')">LB In</button>
    <button id="btn_cbo" onclick="recordTime('coffee_break_out')">CB Out</button>
    <button id="btn_cbi" onclick="recordTime('coffee_break_in')">CB In</button>
    <button id="btn_time_out" onclick="recordTime('time_out')">Final Out</button>
</div>


    <div class="cancel-box" id="cancelBox">
        <p>Time recorded. Cancel within <span id="countdown">5</span> seconds</p>
        <button onclick="cancelLast()">Cancel</button>
    </div>
    <br>

<button onclick="window.location.href='view_attendance.html'"
style="width:100%;background:#00e6e6;color:#003;">
📄 View Attendance
</button>
</div>

<script>
    const USER_ID = 1; // palitan kapag naka-auth na
let pendingColumn = null;
let pendingTime = null;
    
/* ===== SUPABASE SETUP ===== */
const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
async function ensureTodayRow() {
    const today = new Date().toISOString().split("T")[0];

    const { data } = await supabaseClient
        .from("attendance")
        .select("id")
        .eq("user_id", USER_ID)
        .eq("attendance_date", today)
        .single();

    if (!data) {
        await supabaseClient.from("attendance").insert({
            user_id: USER_ID,
            attendance_date: today
        });
    }
}

ensureTodayRow();

/* ===== CLOCK & DATE ===== */
function updateClock() {
    const now = new Date();

    const dateOptions = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    };

    const timeOptions = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    };

    document.getElementById("date").textContent =
        now.toLocaleDateString('en-US', dateOptions);

    document.getElementById("clock").textContent =
        now.toLocaleTimeString('en-US', timeOptions);
}

setInterval(updateClock, 1000);
updateClock();

/* ===== ATTENDANCE LOGIC ===== */
let lastAction = null;
let countdownTimer;
let seconds = 5;

async function recordTime(column) {
    const now = new Date();
    const isoTime = now.toISOString();
    const displayTime = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    });

    const map = {
        time_in: "time_in",
        lunch_break_out: "lbo",
        lunch_break_in: "lbi",
        coffee_break_out: "cbo",
        coffee_break_in: "cbi",
        time_out: "time_out"
    };

    document.getElementById(map[column]).textContent = displayTime;

    pendingColumn = column;
    pendingTime = isoTime;

    seconds = 5;
    document.getElementById("countdown").textContent = seconds;
    document.getElementById("cancelBox").style.display = "block";

    clearInterval(countdownTimer);
    countdownTimer = setInterval(async () => {
        seconds--;
        document.getElementById("countdown").textContent = seconds;

        if (seconds === 0) {
            clearInterval(countdownTimer);
            document.getElementById("cancelBox").style.display = "none";

            await saveToSupabase();
            pendingColumn = null;
            pendingTime = null;
        }
    }, 1000);
}
async function saveToSupabase() {
    const today = new Date().toISOString().split("T")[0];

    const updateData = {};
    updateData[pendingColumn] = pendingTime;

    await supabaseClient
        .from("attendance")
        .update(updateData)
        .eq("user_id", USER_ID)
        .eq("attendance_date", today);

    // 🔒 disable button permanently
    disableButton(pendingColumn);
}
    function disableButton(column) {
    const btnMap = {
        time_in: "btn_time_in",
        lunch_break_out: "btn_lbo",
        lunch_break_in: "btn_lbi",
        coffee_break_out: "btn_cbo",
        coffee_break_in: "btn_cbi",
        time_out: "btn_time_out"
    };

    const btn = document.getElementById(btnMap[column]);
    if (btn) {
        btn.disabled = true;
        btn.style.opacity = 0.5;
        btn.style.cursor = "not-allowed";
    }
}
async function loadTodayAttendance() {
    const today = new Date().toISOString().split("T")[0];

    const { data, error } = await supabaseClient
        .from("attendance")
        .select("*")
        .eq("user_id", USER_ID)
        .eq("attendance_date", today)
        .single();

    if (!data) return;

    // show saved times
    if (data.time_in) {
        document.getElementById("time_in").textContent = formatTime(data.time_in);
        disableButton("time_in");
    }
    if (data.lunch_break_out) {
        document.getElementById("lbo").textContent = formatTime(data.lunch_break_out);
        disableButton("lunch_break_out");
    }
    if (data.lunch_break_in) {
        document.getElementById("lbi").textContent = formatTime(data.lunch_break_in);
        disableButton("lunch_break_in");
    }
    if (data.coffee_break_out) {
        document.getElementById("cbo").textContent = formatTime(data.coffee_break_out);
        disableButton("coffee_break_out");
    }
    if (data.coffee_break_in) {
        document.getElementById("cbi").textContent = formatTime(data.coffee_break_in);
        disableButton("coffee_break_in");
    }
    if (data.time_out) {
        document.getElementById("time_out").textContent = formatTime(data.time_out);
        disableButton("time_out");
    }
}
function formatTime(iso) {
    return new Date(iso).toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });
}

function cancelLast() {
    if (!pendingColumn) return;

    const map = {
        time_in: "time_in",
        lunch_break_out: "lbo",
        lunch_break_in: "lbi",
        coffee_break_out: "cbo",
        coffee_break_in: "cbi",
        time_out: "time_out"
    };

    document.getElementById(map[pendingColumn]).textContent = "--:--";

    // enable button again
    enableButton(pendingColumn);

    pendingColumn = null;
    pendingTime = null;
    clearInterval(countdownTimer);
    document.getElementById("cancelBox").style.display = "none";
}

function enableButton(column) {
    const btnMap = {
        time_in: "btn_time_in",
        lunch_break_out: "btn_lbo",
        lunch_break_in: "btn_lbi",
        coffee_break_out: "btn_cbo",
        coffee_break_in: "btn_cbi",
        time_out: "btn_time_out"
    };

    const btn = document.getElementById(btnMap[column]);
    if (btn) {
        btn.disabled = false;
        btn.style.opacity = 1;
        btn.style.cursor = "pointer";
    }
}
  
 ensureTodayRow();
loadTodayAttendance();
</script>
 
</body>
</html>
