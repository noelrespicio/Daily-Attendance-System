<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f4f7;
  padding:15px;
}
.container{
  max-width:480px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
h2{text-align:center}
.clock{font-size:28px;text-align:center;margin:10px 0}
.date{text-align:center;color:#555}

table{
  width:100%;
  border-collapse:collapse;
  margin:15px 0;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{background:#f7f7f7}

.buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
button{
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
}
button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.cancel{
  text-align:center;
  margin-top:10px;
  display:none;
}
.cancel button{
  background:#ef4444;
}

.view-btn{
  width:100%;
  background:#059669;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="container">

<h2>📋 Daily Attendance</h2>
<div class="date" id="date"></div>
<div class="clock" id="clock"></div>

<table>
<thead>
<tr>
<th>IN</th><th>LB OUT</th><th>LB IN</th>
</tr>
</thead>
<tbody>
<tr>
<td id="time_in">--</td>
<td id="lbo">--</td>
<td id="lbi">--</td>
</tr>
</tbody>
</table>

<table>
<thead>
<tr>
<th>CB OUT</th><th>CB IN</th><th>OUT</th>
</tr>
</thead>
<tbody>
<tr>
<td id="cbo">--</td>
<td id="cbi">--</td>
<td id="time_out">--</td>
</tr>
</tbody>
</table>

<div class="buttons">
<button id="btn_time_in" onclick="record('time_in')">Time In</button>
<button id="btn_lbo" onclick="record('lunch_break_out')">LB Out</button>
<button id="btn_lbi" onclick="record('lunch_break_in')">LB In</button>
<button id="btn_cbo" onclick="record('coffee_break_out')">CB Out</button>
<button id="btn_cbi" onclick="record('coffee_break_in')">CB In</button>
<button id="btn_time_out" onclick="record('time_out')">Time Out</button>
</div>

<div class="cancel" id="cancelBox">
<p>Saving in <span id="count">5</span> seconds</p>
<button onclick="cancel()">Cancel</button>
</div>

<input type="file" id="selfieInput" accept="image/*" capture="user" hidden>

<button class="view-btn" onclick="location.href='view_attendance.html'">
📊 View Attendance
</button>

</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = 'https://wlthlwxcmltwescezjlk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o';

const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);

let user, pendingField=null, pendingTime=null;
let countdown, secs=5;
let locationData={}, selfieURL=null;

/* ================= CLOCK ================= */
setInterval(()=>{
  const now=new Date();
  document.getElementById("clock").innerText=now.toLocaleTimeString();
  document.getElementById("date").innerText=now.toDateString();
},1000);

/* ================= AUTH ================= */
(async()=>{
  const {data}=await supabase.auth.getSession();
  if(!data.session) location.href="login.html";
  user=data.session.user;
  await ensureToday();
  await loadToday();
})();

/* ================= GEOLOCATION ================= */
function getLocation(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>rej(e)
    );
  });
}

/* ================= ENSURE ROW ================= */
async function ensureToday(){
  const today=new Date().toISOString().split("T")[0];
  const {data}=await supabase.from("attendance")
    .select("id")
    .eq("user_id",user.id)
    .eq("attendance_date",today)
    .single();

  if(!data){
    await supabase.from("attendance").insert({
      user_id:user.id,
      attendance_date:today
    });
  }
}

/* ================= RECORD ================= */
async function record(field){
  if(field==="time_in"){
    locationData=await getLocation();
    document.getElementById("selfieInput").click();
    pendingField=field;
    return;
  }
  startCountdown(field);
}

/* ================= SELFIE ================= */
document.getElementById("selfieInput").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file) return;

  const name=`${user.id}/${Date.now()}.jpg`;
  await supabase.storage.from("selfies").upload(name,file,{upsert:true});
  selfieURL=supabase.storage.from("selfies").getPublicUrl(name).data.publicUrl;

  startCountdown("time_in");
});

/* ================= COUNTDOWN ================= */
function startCountdown(field){
  pendingField=field;
  pendingTime=new Date().toISOString();

  document.getElementById(fieldMap[field]).innerText=
    new Date().toLocaleTimeString();

  secs=5;
  document.getElementById("count").innerText=secs;
  document.getElementById("cancelBox").style.display="block";

  countdown=setInterval(async()=>{
    secs--;
    document.getElementById("count").innerText=secs;
    if(secs===0){
      clearInterval(countdown);
      document.getElementById("cancelBox").style.display="none";
      await save();
    }
  },1000);
}

/* ================= SAVE ================= */
async function save(){
  const today=new Date().toISOString().split("T")[0];
  const payload={
    [pendingField]:pendingTime
  };

  if(pendingField==="time_in"){
    payload.latitude=locationData.lat;
    payload.longitude=locationData.lng;
    payload.selfie_url=selfieURL;
  }

  await supabase.from("attendance")
    .update(payload)
    .eq("user_id",user.id)
    .eq("attendance_date",today);

  disable(pendingField);
  pendingField=null;
}

/* ================= CANCEL ================= */
function cancel(){
  clearInterval(countdown);
  document.getElementById(fieldMap[pendingField]).innerText="--";
  pendingField=null;
  document.getElementById("cancelBox").style.display="none";
}

/* ================= LOAD TODAY ================= */
async function loadToday(){
  const today=new Date().toISOString().split("T")[0];
  const {data}=await supabase.from("attendance")
    .select("*")
    .eq("user_id",user.id)
    .eq("attendance_date",today)
    .single();

  if(!data) return;

  for(let k in fieldMap){
    if(data[k]){
      document.getElementById(fieldMap[k]).innerText=
        new Date(data[k]).toLocaleTimeString();
      disable(k);
    }
  }
}

/* ================= HELPERS ================= */
const fieldMap={
  time_in:"time_in",
  lunch_break_out:"lbo",
  lunch_break_in:"lbi",
  coffee_break_out:"cbo",
  coffee_break_in:"cbi",
  time_out:"time_out"
};

function disable(field){
  document.getElementById("btn_"+field).disabled=true;
}
</script>

</body>
</html>
