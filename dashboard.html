<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;padding:15px;}
.container{max-width:480px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.1);}
h2{text-align:center;margin-bottom:15px;}
.clock{font-size:28px;text-align:center;margin:10px 0;}
.date{text-align:center;color:#555;margin-bottom:15px;}
table{width:100%;border-collapse:collapse;margin:15px 0;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px;}
th{background:#f7f7f7;}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;}
button{padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;background:#2563eb;color:#fff;}
button:disabled{background:#aaa;cursor:not-allowed;}
.cancel{text-align:center;margin-top:10px;display:none;}
.cancel button{background:#ef4444;color:#fff;padding:8px 15px;border:none;border-radius:6px;cursor:pointer;}
.view-btn{width:100%;background:#059669;margin-top:15px;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;}
.header{
  display:flex;
  justify-content:space-between; /* LEFT */
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.logout-btn{
  background:#ef4444;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.logout-btn:hover{
  background:#dc2626;
}

</style>
</head>
<body>
<div class="container">
  <button class="logout-btn" onclick="logout()">Logout</button>
<h2>📋 Daily Attendance</h2>
<div class="date" id="date"></div>
<div class="clock" id="clock"></div>

<table>
<tr><th>IN</th><th>LB OUT</th><th>LB IN</th></tr>
<tr>
<td id="time_in">--</td>
<td id="lbo">--</td>
<td id="lbi">--</td>
</tr>
</table>

<table>
<tr><th>CB OUT</th><th>CB IN</th><th>OUT</th></tr>
<tr>
<td id="cbo">--</td>
<td id="cbi">--</td>
<td id="time_out">--</td>
</tr>
</table>

<div class="buttons">
<button id="btn_time_in" onclick="record('time_in',true)">Time In</button>
<button id="btn_lbo" onclick="record('lunch_break_out',false)">LB Out</button>
<button id="btn_lbi" onclick="record('lunch_break_in',false)">LB In</button>
<button id="btn_cbo" onclick="record('coffee_break_out',false)">CB Out</button>
<button id="btn_cbi" onclick="record('coffee_break_in',false)">CB In</button>
<button id="btn_time_out" onclick="record('time_out',true)">Time Out</button>
</div>

<div class="cancel" id="cancelBox">
<p>Saving in <span id="count">5</span> seconds</p>
<button onclick="cancelSave()">Cancel</button>
</div>

<input type="file" id="selfieInput" accept="image/*" capture="user" hidden>
<button class="view-btn" onclick="location.href='view_attendance.html'">📊 View Attendance</button>
</div>

<script>
const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user, pendingField=null, pendingTime=null;
let countdown, seconds=5;
let locationData={}, selfieURL=null;

const fieldMap = {
  time_in:"time_in",
  lunch_break_out:"lbo",
  lunch_break_in:"lbi",
  coffee_break_out:"cbo",
  coffee_break_in:"cbi",
  time_out:"time_out"
};

/* DATE */
function today(){
  const d=new Date();
  return d.toISOString().split("T")[0];
}

/* CLOCK */
setInterval(()=>{
  const now=new Date();
  clock.innerText=now.toLocaleTimeString();
  date.innerText=now.toDateString();
},1000);

/* AUTH */
(async()=>{
  const {data}=await supabaseClient.auth.getSession();
  if(!data.session) location.href="login.html";
  user=data.session.user;
  await ensureToday();
  await loadToday();
})();

/* ENSURE ROW */
async function ensureToday(){
  const {data}=await supabaseClient
    .from("attendance")
    .select("id")
    .eq("user_id",user.id)
    .eq("attendance_date",today())
    .maybeSingle();

  if(!data){
    await supabaseClient.from("attendance").insert({
      user_id:user.id,
      attendance_date:today()
    });
  }
}

/* LOCATION */
function getLocation(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>rej(e.message),
      {enableHighAccuracy:true}
    );
  });
}

/* RECORD */
async function record(field,needLocation){
  pendingField=field;
  pendingTime=new Date();

  if(needLocation){
    try{
      locationData=await getLocation();
    }catch{
      alert("Location required");
      return;
    }

    if(confirm("Selfie is optional. Take one?")){
      selfieInput.click();
    }else{
      startCountdown();
    }
  }else{
    startCountdown();
  }
}

/* SELFIE (OPTIONAL) */
selfieInput.addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file){ startCountdown(); return; }

  const path=`${user.id}/${Date.now()}.jpg`;

  const {error}=await supabaseClient.storage
    .from("selfies")
    .upload(path,file,{upsert:true,contentType:file.type});

  if(!error){
    selfieURL=supabaseClient.storage
      .from("selfies")
      .getPublicUrl(path).data.publicUrl;
  }

  startCountdown();
});

/* COUNTDOWN */
function startCountdown(){
  document.getElementById(fieldMap[pendingField]).innerText=
    pendingTime.toLocaleTimeString();
  seconds=5;
  cancelBox.style.display="block";

  countdown=setInterval(async()=>{
    count.innerText=--seconds;
    if(seconds<=0){
      clearInterval(countdown);
      cancelBox.style.display="none";
      await save();
    }
  },1000);
}

/* SAVE */
async function save(){
  const payload={
    [pendingField]:pendingTime.toISOString(),
    latitude:locationData.lat,
    longitude:locationData.lng
  };

  if(selfieURL) payload.selfie_url=selfieURL;

  await supabaseClient
    .from("attendance")
    .update(payload)
    .eq("user_id",user.id)
    .eq("attendance_date",today());

  selfieURL=null;
}

/* LOAD */
async function loadToday(){
  const {data}=await supabaseClient
    .from("attendance")
    .select("*")
    .eq("user_id",user.id)
    .eq("attendance_date",today())
    .maybeSingle();

  if(!data) return;
  Object.keys(fieldMap).forEach(f=>{
    if(data[f]){
      document.getElementById(fieldMap[f]).innerText=
        new Date(data[f]).toLocaleTimeString();
    }
  });
}

/* LOGOUT */
async function logout(){
  await supabaseClient.auth.signOut();
  location.href="login.html";
}
</script>

</body>
</html>
