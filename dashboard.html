<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f4f7;
  padding:15px;
}
.container{
  max-width:480px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
h2{text-align:center}
.clock{font-size:28px;text-align:center;margin:10px 0}
.date{text-align:center;color:#555}

table{
  width:100%;
  border-collapse:collapse;
  margin:15px 0;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  font-size:14px;
}
th{background:#f7f7f7}

.buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
button{
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
}
button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.cancel{
  text-align:center;
  margin-top:10px;
  display:none;
}
.cancel button{
  background:#ef4444;
}

.view-btn{
  width:100%;
  background:#059669;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="container">

<h2>📋 Daily Attendance</h2>
<div class="date" id="date"></div>
<div class="clock" id="clock"></div>

<table>
<tr><th>IN</th><th>LB OUT</th><th>LB IN</th></tr>
<tr>
<td id="time_in">--</td>
<td id="lbo">--</td>
<td id="lbi">--</td>
</tr>
</table>

<table>
<tr><th>CB OUT</th><th>CB IN</th><th>OUT</th></tr>
<tr>
<td id="cbo">--</td>
<td id="cbi">--</td>
<td id="time_out">--</td>
</tr>
</table>

<div class="buttons">
<button id="btn_time_in" onclick="record('time_in')">Time In</button>
<button id="btn_lbo" onclick="record('lunch_break_out')">LB Out</button>
<button id="btn_lbi" onclick="record('lunch_break_in')">LB In</button>
<button id="btn_cbo" onclick="record('coffee_break_out')">CB Out</button>
<button id="btn_cbi" onclick="record('coffee_break_in')">CB In</button>
<button id="btn_time_out" onclick="record('time_out')">Time Out</button>
</div>

<div class="cancel" id="cancelBox">
<p>Saving in <span id="count">5</span> seconds</p>
<button onclick="cancelSave()">Cancel</button>
</div>

<input type="file" id="selfieInput" accept="image/*" capture="user" hidden>

<button class="view-btn" onclick="location.href='view_attendance.html'">
📊 View Attendance
</button>

</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user;
let pendingField = null;
let pendingTime = null;
let countdown;
let seconds = 5;
let locationData = {};
let selfieURL = null;

/* ================= CLOCK ================= */
setInterval(()=>{
  const now=new Date();
  document.getElementById("clock").innerText=now.toLocaleTimeString();
  document.getElementById("date").innerText=now.toDateString();
},1000);

/* ================= AUTH ================= */
(async()=>{
  const { data } = await supabaseClient.auth.getSession();
  if(!data.session){
    alert("Please login first");
    location.href="login.html";
    return;
  }
  user = data.session.user;
  await ensureToday();
  await loadToday();
})();

/* ================= ENSURE ROW ================= */
async function ensureToday(){
  const today=new Date().toISOString().split("T")[0];
  const { data } = await supabaseClient
    .from("attendance")
    .select("id")
    .eq("user_id",user.id)
    .eq("attendance_date",today)
    .maybeSingle();

  if(!data){
    await supabaseClient.from("attendance").insert({
      user_id:user.id,
      attendance_date:today
    });
  }
}

/* ================= GEOLOCATION ================= */
function getLocation(){
  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      }),
      err=>reject("Location permission denied")
    );
  });
}

/* ================= RECORD ================= */
async function record(field){
  if(document.getElementById("btn_"+field)?.disabled) return;

  if(field==="time_in"){
    try{
      locationData = await getLocation();
      pendingField = field;
      document.getElementById("selfieInput").click();
    }catch(e){
      alert(e);
    }
    return;
  }
  startCountdown(field);
}

/* ================= SELFIE ================= */
document.getElementById("selfieInput").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file) return;

  const path=`${user.id}/${Date.now()}.jpg`;
  await supabaseClient.storage.from("selfies").upload(path,file,{upsert:true});
  selfieURL = supabaseClient.storage.from("selfies").getPublicUrl(path).data.publicUrl;

  startCountdown("time_in");
});

/* ================= COUNTDOWN ================= */
function startCountdown(field){
  pendingField = field;
  pendingTime = new Date().toISOString();

  document.getElementById(field).innerText =
    new Date().toLocaleTimeString();

  seconds = 5;
  document.getElementById("count").innerText = seconds;
  document.getElementById("cancelBox").style.display="block";

  countdown = setInterval(async()=>{
    seconds--;
    document.getElementById("count").innerText = seconds;
    if(seconds<=0){
      clearInterval(countdown);
      document.getElementById("cancelBox").style.display="none";
      await save();
    }
  },1000);
}

/* ================= SAVE ================= */
async function save(){
  const today=new Date().toISOString().split("T")[0];
  const payload={ [pendingField]: pendingTime };

  if(pendingField==="time_in"){
    payload.latitude=locationData.lat;
    payload.longitude=locationData.lng;
    payload.selfie_url=selfieURL;
  }

  await supabaseClient.from("attendance")
    .update(payload)
    .eq("user_id",user.id)
    .eq("attendance_date",today);

  document.getElementById("btn_"+pendingField).disabled=true;
  pendingField=null;
}

/* ================= CANCEL ================= */
function cancelSave(){
  clearInterval(countdown);
  document.getElementById(pendingField).innerText="--";
  pendingField=null;
  document.getElementById("cancelBox").style.display="none";
}

/* ================= LOAD ================= */
async function loadToday(){
  const today=new Date().toISOString().split("T")[0];
  const { data } = await supabaseClient
    .from("attendance")
    .select("*")
    .eq("user_id",user.id)
    .eq("attendance_date",today)
    .maybeSingle();

  if(!data) return;

  for(const key of ["time_in","lunch_break_out","lunch_break_in","coffee_break_out","coffee_break_in","time_out"]){
    if(data[key]){
      document.getElementById(key).innerText =
        new Date(data[key]).toLocaleTimeString();
      document.getElementById("btn_"+key).disabled=true;
    }
  }
}
</script>
</body>
</html>
