<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Location</title>

<!-- LEAFLET (FREE MAP) -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}
#map {
  height: 100%;
  width: 100%;
}
.back {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1000;
  background: #2563eb;
  color: #fff;
  padding: 10px 15px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<a href="view_attendance.html" class="back">⬅ Back</a>
<div id="map"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // GET LAT & LNG FROM URL
  const params = new URLSearchParams(window.location.search);
  let lat = parseFloat(params.get("lat"));
  let lng = parseFloat(params.get("lng"));

  // FALLBACK LOCATION (Manila)
  if (isNaN(lat) || isNaN(lng)) {
    lat = 14.5995;
    lng = 120.9842;
  }

  // INIT MAP
  const map = L.map("map").setView([lat, lng], 16);

  // TILE LAYER (FREE)
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  // MARKER
  L.marker([lat, lng])
    .addTo(map)
    .bindPopup("📍 Attendance Location")
    .openPopup();

});
</script>

</body>
</html>
