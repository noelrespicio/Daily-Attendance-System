<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Location</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-sA+rqxk5u6i8+IJbJwRWvLv9Gl+bM5QokZbt+vG6vJs=" crossorigin=""/>

<style>
body{margin:0;padding:0;font-family:Arial,sans-serif;}
#map{height:100vh;width:100%;}
</style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-o9N1j+vHm8r6LxFgt3Vq5rjYF7RovJ6rHzPCp1t+F8A=" crossorigin=""></script>

<script>
// =================== GET LAT/LNG ===================ppp
const urlParams = new URLSearchParams(window.location.search);
const lat = parseFloat(urlParams.get('latitude'));
const lng = parseFloat(urlParams.get('longitude'));

if(!lat || !lng){
    alert("Invalid location data!");
} else {
    // =================== INIT MAP ===================
    const map = L.map('map').setView([lat,lng], 16);

    // =================== TILE LAYER ===================
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // =================== MARKER ===================
    const marker = L.marker([lat,lng]).addTo(map);
    marker.bindPopup("📍 Attendance Location").openPopup();
}
</script>

</body>
</html>
