<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Location</title>

<!-- FREE MAP (LEAFLET + OPENSTREETMAP) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}
#map {
  height: 100%;
  width: 100%;
}
.back {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1000;
  background: #2563eb;
  color: #fff;
  padding: 10px 15px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<a href="view_attendance.html" class="back">⬅ Back</a>
<div id="map"></div>

<script>
const SUPABASE_URL = "https://wlthlwxcmltwescezjlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o"; // same key you use everywhere
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.addEventListener("DOMContentLoaded", async () => {

  /* 1️⃣ GET LOGGED-IN USER */
  const { data: sessionData } = await supabase.auth.getSession();
  if (!sessionData.session) {
    alert("Not logged in");
    location.href = "login.html";
    return;
  }

  const userId = sessionData.session.user.id;

  /* 2️⃣ GET DATE (OPTIONAL) */
  const params = new URLSearchParams(window.location.search);
  const date =
    params.get("date") ||
    new Date().toISOString().split("T")[0];

  /* 3️⃣ FETCH ATTENDANCE LOCATION FROM DB */
  const { data, error } = await supabase
    .from("attendance")
    .select("latitude, longitude, time_in")
    .eq("user_id", userId)
    .eq("attendance_date", date)
    .maybeSingle();

  if (error || !data) {
    alert("No attendance record found");
    return;
  }

  let lat = Number(data.latitude);
  let lng = Number(data.longitude);

  if (isNaN(lat) || isNaN(lng)) {
    alert("No location saved for this attendance");
    return;
  }

  /* 4️⃣ INIT MAP */
  const map = L.map("map").setView([lat, lng], 16);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  /* 5️⃣ MARKER */
  L.marker([lat, lng])
    .addTo(map)
    .bindPopup(`
      📍 <b>Attendance Location</b><br>
      Date: ${date}<br>
      Time In: ${data.time_in ? new Date(data.time_in).toLocaleTimeString() : '--'}
    `)
    .openPopup();
});
</script>

</body>
</html>
