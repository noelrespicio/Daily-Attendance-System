<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body, html{margin:0;padding:0;height:100%;}
  #map{width:100%;height:100%;}
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Get URL parameters
  const params = new URLSearchParams(window.location.search);
  const lat = parseFloat(params.get('lat'));
  const lng = parseFloat(params.get('lng'));

  if(isNaN(lat) || isNaN(lng)){
    alert("Invalid coordinates!");
  } else {
    // Initialize map
    const map = L.map('map').setView([lat, lng], 16);

    // Modern tile layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Array of markers: [lat, lng, label]
    const locations = [
      [lat, lng, "📍 Attendance Location"],
      [10.7105, 122.5622, "🏬 SM Appliance"],        // Example coordinates
      [10.7120, 122.5640, "🏫 Local School"],
      [10.7080, 122.5600, "☕ Coffee Shop"]
    ];

    // Add all markers to map
    locations.forEach(loc => {
      const marker = L.marker([loc[0], loc[1]]).addTo(map);
      marker.bindPopup(loc[2]);
    });
  }
</script>
</body>
</html>
