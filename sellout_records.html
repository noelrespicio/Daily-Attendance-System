<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellout Records</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  padding:15px;
}

.container{
  max-width:1100px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h2{
  color:#1e3a8a;
}

.back-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

input[type="month"]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:10px;
}

.date-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.date-btn{
  background:#1e40af;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.date-btn:hover{
  background:#1d4ed8;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

th{
  background:#f3f4f6;
}

.no-data{
  text-align:center;
  padding:20px;
  color:#666;
}

.edit-input{
  width:100%;
  padding:8px;
  border:1px solid #ddd;
  border-radius:6px;
}

.save-msg{
  margin-top:10px;
  color:green;
  font-size:14px;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h2>📋 Sellout Records</h2>

    <button class="back-btn"
      onclick="location.href='sellout_inventory.html'">
      ← Back
    </button>
  </div>

  <!-- MONTH FILTER -->
  <div class="card">

    <h3>Select Sellout Month</h3>

    <input type="month"
      id="filterMonth"
      onchange="filterByMonth()">

    <div class="date-list" id="monthList">
      Loading months...
    </div>

  </div>

  <!-- RECORDS -->
  <div class="card">

    <h3 id="recordTitle">
      Sellout Items
    </h3>

    <div class="save-msg" id="saveMsg"></div>

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Model</th>
          <th>SN IN</th>
          <th>SN OUT</th>
          <th>Invoice No.</th>
          <th>Qty</th>
        </tr>
      </thead>

      <tbody id="recordsTable">
        <tr>
          <td colspan="6" class="no-data">
            Loading...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>

<script>
const SUPABASE_URL =
"https://wlthlwxcmltwescezjlk.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user;

/* AUTH */
(async()=>{

  const { data } =
    await supabaseClient.auth.getSession();

  if(!data.session){
    location.href = "login.html";
    return;
  }

  user = data.session.user;

  loadAvailableMonths();

})();

/* LOAD AVAILABLE MONTHS */
async function loadAvailableMonths(){

  const monthList =
    document.getElementById("monthList");

  const { data, error } =
    await supabaseClient
      .from("sellout_inventory")
      .select("sellout_date")
      .eq("user_id", user.id)
      .order("sellout_date",{ascending:false});

  if(error){
    monthList.innerHTML =
      "Failed to load months";
    return;
  }

  if(!data.length){
    monthList.innerHTML =
      "No sellout records";
    return;
  }

  const months =
    data.map(d => d.sellout_date.substring(0,7));

  const uniqueMonths =
    [...new Set(months)];

  monthList.innerHTML = "";

  uniqueMonths.forEach(month=>{

    monthList.innerHTML += `
      <button class="date-btn"
        onclick="loadRecords('${month}')">
        ${month}
      </button>
    `;

  });

}

/* FILTER */
function filterByMonth(){

  const month =
    document.getElementById("filterMonth").value;

  if(!month) return;

  loadRecords(month);

}

/* LOAD RECORDS */
async function loadRecords(month){

  document.getElementById("recordTitle")
    .innerText =
    `Sellout Items - ${month}`;

  const tbody =
    document.getElementById("recordsTable");

  tbody.innerHTML = `
    <tr>
      <td colspan="6" class="no-data">
        Loading...
      </td>
    </tr>
  `;

  const startDate = `${month}-01`;
  const endDate = `${month}-31`;

  const { data, error } =
    await supabaseClient
      .from("sellout_inventory")
      .select("*")
      .eq("user_id", user.id)
      .gte("sellout_date", startDate)
      .lte("sellout_date", endDate)
      .order("sellout_date",{ascending:false});

  if(error){

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="no-data">
          Failed to load
        </td>
      </tr>
    `;

    return;
  }

  if(!data.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="no-data">
          No records found
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = "";

  data.forEach(item=>{

    tbody.innerHTML += `
      <tr>

        <td>
          <input type="date"
            class="edit-input"
            value="${item.sellout_date || ''}"
            onchange="updateRecord('${item.id}','sellout_date',this.value)">
        </td>

        <td>
          <input type="text"
            class="edit-input"
            value="${item.model || ''}"
            onchange="updateRecord('${item.id}','model',this.value)">
        </td>

        <td>
          <input type="text"
            class="edit-input"
            value="${item.sn_in || ''}"
            onchange="updateRecord('${item.id}','sn_in',this.value)">
        </td>

        <td>
          <input type="text"
            class="edit-input"
            value="${item.sn_out || ''}"
            onchange="updateRecord('${item.id}','sn_out',this.value)">
        </td>

        <td>
          <input type="text"
            class="edit-input"
            value="${item.invoice_no || ''}"
            onchange="updateRecord('${item.id}','invoice_no',this.value)">
        </td>

        <td>
          <input type="number"
            class="edit-input"
            value="${item.qty || 0}"
            onchange="updateRecord('${item.id}','qty',this.value)">
        </td>

      </tr>
    `;

  });

}

/* UPDATE RECORD */
async function updateRecord(id, field, value){

  const saveMsg =
    document.getElementById("saveMsg");

  const updateData = {};
  updateData[field] = value;

  const { error } =
    await supabaseClient
      .from("sellout_inventory")
      .update(updateData)
      .eq("id", id);

  if(error){

    saveMsg.style.color = "red";
    saveMsg.innerText =
      "❌ Update failed";

    console.error(error);

    return;
  }

  saveMsg.style.color = "green";
  saveMsg.innerText =
    "✅ Record updated successfully";

  setTimeout(()=>{
    saveMsg.innerText = "";
  },2000);

}
</script>

</body>
</html>
