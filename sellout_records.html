<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellout Records</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  padding:15px;
}

.container{
  max-width:1200px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

.header h2{
  color:#1e3a8a;
  font-size:22px;
}

.back-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

input[type="month"]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:10px;
}

.month-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.month-btn{
  background:#1e40af;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.month-btn:hover{
  background:#1d4ed8;
}

.summary-box{
  margin-top:15px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  padding:15px;
  border-radius:12px;
}

.summary-title{
  font-size:14px;
  color:#1e3a8a;
  margin-bottom:5px;
  font-weight:bold;
}

.summary-value{
  font-size:28px;
  color:#111827;
  font-weight:bold;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-top:15px;
}

.info-box label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
  color:#374151;
}

.info-box input{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
}

.download-btn{
  margin-top:20px;
  background:#16a34a;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.download-btn:hover{
  background:#15803d;
}

.table-wrapper{
  overflow-x:auto;
  width:100%;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  min-width:900px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:13px;
  vertical-align:top;
}

th{
  background:#f3f4f6;
  font-weight:bold;
}

th:nth-child(1),
td:nth-child(1){
  width:100px;
}

th:nth-child(2),
td:nth-child(2){
  width:140px;
}

th:nth-child(3),
td:nth-child(3){
  width:220px;
}

th:nth-child(4),
td:nth-child(4){
  width:220px;
}

th:nth-child(5),
td:nth-child(5){
  width:120px;
}

th:nth-child(6),
td:nth-child(6){
  width:70px;
  text-align:center;
}

.model-text{
  font-weight:600;
  word-break:break-word;
  white-space:normal;
  line-height:1.4;
}

.serial{
  font-size:11px;
  word-break:break-word;
  white-space:normal;
  line-height:1.5;
}

.no-data{
  text-align:center;
  padding:20px;
  color:#666;
}

@media(max-width:768px){

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .header h2{
    font-size:20px;
  }

  .card{
    padding:15px;
  }

}
</style>
</head>
<body>

<div class="container">

  <div class="header">

    <h2>📋 Sellout Records</h2>

    <button class="back-btn"
      onclick="location.href='sellout_inventory.html'">
      ← Back
    </button>

  </div>

  <!-- MONTH FILTER -->
  <div class="card">

    <h3>Select Sellout Month</h3>

    <input
      type="month"
      id="filterMonth"
      onchange="filterByMonth()"
    >

    <div class="month-list" id="monthList">
      Loading months...
    </div>

    <!-- TOTAL -->
    <div class="summary-box">

      <div class="summary-title">
        Total Sellout Quantity
      </div>

      <div class="summary-value" id="totalQty">
        0
      </div>

    </div>

  </div>

  <!-- EMPLOYEE INFO -->
  <div class="card">

    <h3>Employee Information</h3>

    <div class="info-grid">

      <div class="info-box">
        <label>Name</label>
        <input
          type="text"
          id="employeeName"
          placeholder="Enter employee name"
        >
      </div>

      <div class="info-box">
        <label>Branch</label>
        <input
          type="text"
          id="branchName"
          placeholder="Enter branch"
        >
      </div>

      <div class="info-box">
        <label>Position</label>
        <input
          type="text"
          id="positionName"
          placeholder="Enter position"
        >
      </div>

      <div class="info-box">
        <label>Product Assigned</label>
        <input
          type="text"
          id="productAssign"
          placeholder="Enter assigned product"
        >
      </div>

    </div>

    <button class="download-btn"
      onclick="downloadDocument()">
      ⬇ Download Sellout Document
    </button>

  </div>

  <!-- RECORDS -->
  <div class="card">

    <h3 id="recordTitle">
      Sellout Items
    </h3>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Model</th>
            <th>Serial IN</th>
            <th>Serial OUT</th>
            <th>Invoice No.</th>
            <th>Qty</th>
          </tr>
        </thead>

        <tbody id="recordsTable">

          <tr>
            <td colspan="6" class="no-data">
              Loading...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<script>
const SUPABASE_URL =
"https://wlthlwxcmltwescezjlk.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdGhsd3hjbWx0d2VzY2V6amxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NDQ4MDcsImV4cCI6MjA2NzAyMDgwN30.tvUeTFVDdQomDHHV0JSpsXHP9IbQVkOhEvBpCglzI-o";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user;

/* AUTH */
(async()=>{

  const { data } =
    await supabaseClient.auth.getSession();

  if(!data.session){
    location.href = "login.html";
    return;
  }

  user = data.session.user;

  loadAvailableMonths();

})();

/* LOAD MONTHS */
async function loadAvailableMonths(){

  const monthList =
    document.getElementById("monthList");

  const { data, error } =
    await supabaseClient
      .from("sellout_inventory")
      .select("sellout_date")
      .eq("user_id", user.id)
      .order("sellout_date",{ascending:false});

  if(error){

    monthList.innerHTML =
      "Failed to load months";

    return;
  }

  if(!data.length){

    monthList.innerHTML =
      "No sellout records";

    return;
  }

  const months =
    [...new Set(
      data.map(d =>
        d.sellout_date.substring(0,7)
      )
    )];

  monthList.innerHTML = "";

  months.forEach(month => {

    monthList.innerHTML += `
      <button
        class="month-btn"
        onclick="loadRecords('${month}')">
        ${month}
      </button>
    `;

  });

}

/* FILTER */
function filterByMonth(){

  const month =
    document.getElementById("filterMonth").value;

  if(!month) return;

  loadRecords(month);

}

/* LOAD RECORDS */
async function loadRecords(month){

  document.getElementById("recordTitle")
    .innerText =
    `Sellout Items - ${month}`;

  const tbody =
    document.getElementById("recordsTable");

  tbody.innerHTML = `
    <tr>
      <td colspan="6" class="no-data">
        Loading...
      </td>
    </tr>
  `;

  const startDate = `${month}-01`;

const endDate = new Date(
  Number(month.split('-')[0]),
  Number(month.split('-')[1]),
  0
).toISOString().split('T')[0];
  
  const { data, error } =
    await supabaseClient
      .from("sellout_inventory")
      .select("*")
      .eq("user_id", user.id)
      .gte("sellout_date", startDate)
      .lte("sellout_date", endDate)
      .order("sellout_date",{ascending:false});

  if(error){

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="no-data">
          Failed to load
        </td>
      </tr>
    `;

    return;
  }

  if(!data.length){

    document.getElementById("totalQty")
      .innerText = "0";

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="no-data">
          No records found
        </td>
      </tr>
    `;

    return;
  }

  /* TOTAL QTY */
  let totalQty = 0;

  data.forEach(item => {
    totalQty += Number(item.qty || 0);
  });

  document.getElementById("totalQty")
    .innerText = totalQty;

  tbody.innerHTML = "";

  data.forEach(item => {

    tbody.innerHTML += `
      <tr>

        <td>
          ${item.sellout_date}
        </td>

        <td class="model-text">
          ${item.model}
        </td>

        <td class="serial">
          ${item.sn_in || "-"}
        </td>

        <td class="serial">
          ${item.sn_out || "-"}
        </td>

        <td>
          ${item.invoice_no || "-"}
        </td>

        <td>
          ${item.qty}
        </td>

      </tr>
    `;

  });

}

/* DOWNLOAD DOCUMENT */
function downloadDocument(){

  const name =
    document.getElementById("employeeName").value || "N/A";

  const branch =
    document.getElementById("branchName").value || "N/A";

  const position =
    document.getElementById("positionName").value || "N/A";

  const product =
    document.getElementById("productAssign").value || "N/A";

  const month =
    document.getElementById("recordTitle").innerText;

  const totalQty =
    document.getElementById("totalQty").innerText;

  const tableHTML =
    document.querySelector("table").outerHTML;

  const printWindow =
    window.open('', '', 'width=1200,height=800');

  printWindow.document.write(`

    <html>

    <head>

      <title>Sellout Document</title>

      <style>

        body{
          font-family:Arial,sans-serif;
          padding:30px;
          color:#111;
        }

        table{
          width:100%;
          border-collapse:collapse;
          margin-top:20px;
        }

        th,td{
          border:1px solid #ccc;
          padding:10px;
          font-size:12px;
          text-align:left;
          vertical-align:top;
        }

        th{
          background:#f3f4f6;
        }

        .title{
          text-align:center;
          margin-bottom:25px;
        }

        .title h2{
          margin:0;
          font-size:24px;
        }

        .title p{
          margin-top:5px;
          color:#555;
        }

        .info{
          margin-bottom:20px;
          line-height:2;
          font-size:14px;
        }

        .total-box{
          margin-top:20px;
          padding:15px;
          border:1px solid #ccc;
          width:280px;
          font-size:18px;
          font-weight:bold;
        }

        .signature{
          margin-top:70px;
          display:flex;
          justify-content:space-between;
        }

        .sign-box{
          width:250px;
          text-align:center;
        }

        .line{
          border-top:1px solid #000;
          margin-top:50px;
          padding-top:5px;
        }

      </style>

    </head>

    <body>

      <div class="title">

        <h2>DAIKIN SELL OUT REPORT</h2>

        <p>${month}</p>

      </div>

      <div class="info">

        <strong>Name:</strong> ${name}<br>

        <strong>Branch:</strong> ${branch}<br>

        <strong>Position:</strong> ${position}<br>

        <strong>Product Assigned:</strong> ${product}

      </div>

      ${tableHTML}

      <div class="total-box">
        Total Sellout Quantity: ${totalQty}
      </div>

      <div class="signature">

        <div class="sign-box">

          <div class="line">
            Prepared By
          </div>

        </div>

        <div class="sign-box">

          <div class="line">
            Checked By
          </div>

        </div>

      </div>

    </body>

    </html>

  `);

  printWindow.document.close();

  printWindow.print();

}
</script>

</body>
</html>
